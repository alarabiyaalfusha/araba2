const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
function head(title,ribbon){return `<div class="pill">${title}</div><div class="banner"><div class="logo">${LOGO}</div><div class="t1">العربية الفصحى</div><div class="t2">AL-FUSHA ACADEMY</div></div><div class="badge"><div class="c">A2</div><div class="p">Dasar</div></div>${ribbon?`<div class="ribbon">${ribbon}</div>`:''}`}
function nav(prev,next,pl,nl){return `<button class="nbtn" style="left:50px" onclick="${prev}"><i>←</i>${pl}</button>${next?`<button class="nbtn" style="right:50px;flex-direction:row-reverse" onclick="${next}"><i>→</i>${nl}</button>`:''}`}
function speaker(id,key,text){return `<button class="spk" id="${id}" onclick="sp('${key}','${esc(text).replace(/\\/g,'')}','${id}')">${SPK}</button>`}
function tools(){return `<div id="tools"><div class="tool">Kecepatan · السرعة<div class="row"><button class="${rate==0.6?'on':''}" onclick="setRate(0.6)">🐢</button><button class="${rate==0.85?'on':''}" onclick="setRate(0.85)">🙂</button><button class="${rate==1?'on':''}" onclick="setRate(1)">🐇</button></div></div><div class="tool">Otomatis · تلقائي<div class="row"><button class="${auto?'on':''}" onclick="setAuto(true)">ON</button><button class="${!auto?'on':''}" onclick="setAuto(false)">OFF</button></div></div></div>`}
window.setRate=r=>{rate=r;render()};window.setAuto=a=>{auto=a;render(true)};

/* ---------- state ---------- */
let S={v:'hub',t:0,i:0};
function slides(t){
  const T=D.topics[t],L=[{k:'cover'}];
  T.items.forEach((it,j)=>{L.push({k:'s',j});if(it.aar)L.push({k:'d',j})});
  L.push({k:'end'});return L;
}
function go(h){location.hash=h}
function parse(){
  const h=location.hash.slice(1)||'hub';
  if(h==='hub'||h==='lessons'||h==='quizzes')S={v:h};
  else{const m=h.match(/^t(\d+)\/(\d+)$/);if(m)S={v:'t',t:+m[1],i:+m[2]};else S={v:'hub'}}
  render();
}
addEventListener('hashchange',parse);

function render(keep){
  if(!keep)stopAudio();
  let h='';
  if(S.v==='hub'){
    h=head('A2<small>Pilih menu</small>','Level A2 · Dasar — Pilih menu belajar')+
    `<a class="hcard" style="left:290px" href="#lessons"><div class="ic"><svg viewBox="0 0 64 64"><path d="M8 14q12-4 24 4q12-8 24-4v38q-12-4-24 4q-12-8-24-4z" fill="#fff"/><path d="M32 18v38" stroke="#076756" stroke-width="3"/></svg></div><div class="a">الدروس</div><div class="i">PELAJARAN</div><div class="s">Slide kalimat + contoh dialog + audio</div></a>
     <a class="hcard" style="left:1010px" href="#quizzes"><div class="ic"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#fff"/><path d="M19 33l9 9 18-20" stroke="#076756" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="a">الاختبارات</div><div class="i">KUIS</div><div class="s">Latihan interaktif per topik</div></a>
     <div id="hint">Listen • Repeat • Understand • Use</div>`;
  }else if(S.v==='lessons'||S.v==='quizzes'){
    const q=S.v==='quizzes';
    let g='';
    D.all.forEach((p,k)=>{
      const n=k+1,on=q?!!QUIZ[n]:READY.includes(n),x=(k%5)*344,y=Math.floor(k/5)*69;
      const href=on?(q?QUIZ[n]:'#t'+n+'/0'):null;
      g+=`<${on?'a href="'+href+'"':'div'} class="gi ${on?'on':''}" style="left:${x}px;top:${y}px">${on?`<span class="no">${n}</span>`:LOCK}<div class="tx"><div class="ta">${p[0]}</div><div class="ti">${p[1]}</div></div></${on?'a':'div'}>`;
    });
    h=head(q?'KUIS':'PELAJARAN',q?'Pilih kuis · اختر الاختبار':'Pilih topik · اختر الموضوع')+`<div class="grid">${g}</div>`+nav("go('hub')",null,'Menu Utama','');
  }else{
    const T=D.topics[S.t],L=slides(S.t),s=L[S.i],last=L.length-1;
    const pt=`TOPIK ${S.t}<small>${esc(T.id)}</small>`;
    const rb=s.k==='s'?'Kalimat · الجملة':s.k==='d'?'Contoh dialog · حوار':s.k==='cover'?'Mulai belajar':'Ringkasan · مراجعة';
    h=head(pt,rb);
    let body='',autoList=null;
    if(s.k==='cover'){
      h+=`<div class="cover fade"><div class="meta">Topik ${S.t} · ${T.items.length} kalimat</div><div class="ar" style="font-size:${dn(T.ar)>26?76:92}px">${T.ar}</div><div class="id" style="font-size:${T.id.length>34?38:46}px">${esc(T.id)}</div><button class="go" onclick="go('t${S.t}/1')">Mulai · ابدأ ←</button></div>`;
    }else if(s.k==='s'){
      const it=T.items[s.j],two=it.v.length>1;
      let cols='';autoList=[];
      it.v.forEach((v,q)=>{
        const id='sp'+q,key=it.n+(q?'f':'');
        autoList.push([key,v.ar,id]);
        cols+=`<div class="col ${two?'':'one'}">${v.l?`<span class="lab">${v.l}</span>`:''}<div class="ar" style="font-size:${arSize(v.ar,!two)}px">${v.ar}</div><div class="tr" style="font-size:${two?Math.min(28,trSize(v.tr)):trSize(v.tr)}px">${esc(v.tr)}</div>${speaker(id,key,v.ar)}</div>`;
      });
      h+=`<div class="card fade"><div class="numb">${it.n}</div><div class="cols">${cols}</div><div class="mean" style="font-size:${mSize(it.id)}px">${esc(it.id)}</div></div>`;
      window._al=autoList;
    }else if(s.k==='d'){
      const it=T.items[s.j];
      autoList=[[it.n+'a',it.aar,'sa'],[it.n+'b',it.bar,'sb']];
      h+=`<div class="card fade"><div class="numb">${it.n}</div><div class="dlg">
       <div class="bub a"><div class="who">أ</div><div class="txt"><div class="ar" style="font-size:${dSize(it.aar)}px">${it.aar.replace(/^أ:\s*/,'')}</div><div class="idn">${esc(it.aid)}</div></div>${speaker('sa',it.n+'a',it.aar.replace(/^أ:\s*/,''))}</div>
       <div class="bub b"><div class="who">ب</div><div class="txt"><div class="ar" style="font-size:${dSize(it.bar)}px">${it.bar.replace(/^ب:\s*/,'')}</div><div class="idn">${esc(it.bid)}</div></div>${speaker('sb',it.n+'b',it.bar.replace(/^ب:\s*/,''))}</div></div>
       <button class="pdlg" onclick="seq(window._al)">▶ Putar dialog · شغّل الحوار</button></div>`;
      autoList=[[it.n+'a',it.aar.replace(/^أ:\s*/,''),'sa'],[it.n+'b',it.bar.replace(/^ب:\s*/,''),'sb']];
      window._al=autoList;
    }else{
      let rows='';T.items.forEach((it,j)=>{rows+=`<a href="#t${S.t}/${slides(S.t).findIndex(x=>x.k==='s'&&x.j===j)}" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:2px 12px"><b style="color:var(--g);width:46px;font-size:20px">${it.n}</b><span class="ar" style="font-size:26px;font-weight:700;flex:1;min-width:0;color:var(--gd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.v[0].ar}</span></a>`});
      h+=`<div class="card fade" style="overflow:auto;padding:26px 30px"><div style="display:grid;grid-template-columns:repeat(${T.items.length>24?3:2},minmax(0,1fr));gap:8px">${rows}</div></div>
      ${QUIZ[S.t]?`<a class="go" style="position:absolute;left:1560px;top:300px;width:320px;text-align:center;font-size:30px;padding:18px 10px;line-height:1.3;text-decoration:none" href="${QUIZ[S.t]}">Kuis topik ${S.t}<br>الاختبار ←</a>`:''}`;
    }
    const pv=S.i>0?`go('t${S.t}/${S.i-1}')`:"go('lessons')";
    const nx=S.i<last?`go('t${S.t}/${S.i+1}')`:`go('lessons')`;
    h+=`<a class="homeb" href="#hub" title="Menu Utama"><svg viewBox="0 0 64 64"><path d="M8 32L32 10l24 22h-7v22H39V40H25v14H15V32z" fill="#f2c651"/></svg>Menu Utama</a>`;
    h+=`<div id="cnt">${S.i+1} / ${L.length}</div><div id="prog"><b style="width:${(S.i/last)*100}%"></b></div>`;
    h+=nav(pv,nx,S.i>0?'Sebelumnya':'Daftar isi',S.i<last?'Selanjutnya':'Selesai');
    if(s.k==='s'||s.k==='d')h+=tools();
    ui.innerHTML=h;
    if((s.k==='s'||s.k==='d')&&auto&&!keep)setTimeout(()=>seq(window._al),450);
    if(!('speechSynthesis' in window))$('#warn').textContent='Browser tidak mendukung suara · المتصفح لا يدعم الصوت';
    return;
  }
  ui.innerHTML=h;
}
addEventListener('keydown',e=>{
  if(S.v!=='t')return;const L=slides(S.t);
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go('t'+S.t+'/'+Math.min(S.i+1,L.length-1));
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go('t'+S.t+'/'+Math.max(S.i-1,0));
  else if(e.key==='p')seq(window._al||[]);
});
let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null||S.v!=='t')return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<90)return;const L=slides(S.t);
  go('t'+S.t+'/'+(dx<0?Math.min(S.i+1,L.length-1):Math.max(S.i-1,0)))},{passive:true});
parse();
</script>
</body>
</html>
