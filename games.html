<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permainan Bahasa Arab · Level A2</title>
<meta name="description" content="Permainan bahasa Arab interaktif: tangkap arti, susun kalimat, tebak suara, kartu memori, ular tangga, pop balon, dan tebak gambar. AL-Arabiya AL-Fusha.">
<meta property="og:title" content="Permainan Bahasa Arab · Level A2">
<meta property="og:description" content="Main game bahasa Arab gratis. Bisa kalahkan skorku?">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#70452E;--cd:#352116;--gold:#D6A63C;--champ:#F4D98B;--ivory:#FFF9EB;--ink:#352116;--mut:#6b5a4c;--line:#eadfcb;--ok:#2e9e6a;--no:#d04545}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--ivory);color:var(--ink);overflow-x:hidden}
.ar{font-family:Amiri,'Noto Naskh Arabic',serif;direction:rtl}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bgc{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;min-height:100%;padding:14px 16px 40px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.brand b{display:block;font-family:Amiri,serif;font-size:1.15rem;line-height:1.1}
.brand small{display:block;font-size:.62rem;letter-spacing:.12em;font-weight:600;color:var(--mut)}
.badge{width:52px;height:58px;border-radius:12px 12px 26px 26px;background:var(--c);border:3px solid var(--gold);color:var(--champ);font-weight:800;font-size:1.2rem;display:flex;align-items:center;justify-content:center;flex:none}
h1{font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.15;font-weight:800;text-align:center}
h1 span{color:var(--c)}
.sub{text-align:center;color:var(--mut);margin:6px 0 18px;font-size:.95rem}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 14px 14px;text-align:center;box-shadow:0 8px 20px rgba(53,33,22,.06);transition:transform .15s}
.gcard:hover{transform:translateY(-3px)}
.gcard .em{font-size:2.4rem;line-height:1.1}
.gcard h3{font-size:1rem;margin-top:6px}
.gcard .an{font-family:Amiri,serif;color:var(--c);font-size:1.15rem;font-weight:700}
.gcard p{font-size:.76rem;color:var(--mut);margin-top:4px;line-height:1.35}
.gcard .best{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:700;background:var(--ivory);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.sel{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 16px;font-size:.85rem;font-weight:600}
.sel select{font:inherit;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;max-width:70vw}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin-top:14px}
.free{margin-top:16px;background:#fff;border:2px dashed var(--gold);border-radius:18px;padding:14px;text-align:center;font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;font-weight:700;border-radius:999px;padding:12px 22px;text-decoration:none;box-shadow:0 6px 16px rgba(53,33,22,.18);font-size:.95rem}
.btn.gold{background:var(--gold);color:#2a1a0f}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* game hud */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hud .back{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:1.2rem;flex:none}
.hud .ttl{font-weight:800;font-size:1rem;flex:1;text-align:center}
.stat{display:flex;gap:6px}
.stat span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar b{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 10px 26px rgba(53,33,22,.07)}
.prompt{text-align:center;font-weight:700;font-size:1.05rem}
.prompt small{display:block;font-weight:500;color:var(--mut);font-size:.8rem;margin-bottom:4px}
/* catcher */
.arena{position:relative;height:min(58vh,520px);border-radius:24px;background:linear-gradient(#fff,var(--ivory));border:1px solid var(--line);overflow:hidden;margin-top:12px;touch-action:manipulation}
.drop{position:absolute;width:31%;min-height:76px;padding:8px 6px;border-radius:18px;background:#fff;border:3px solid var(--c);display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 8px 16px rgba(53,33,22,.12);font-family:Amiri,serif;direction:rtl;font-weight:700;font-size:clamp(1.05rem,4.6vw,1.5rem);line-height:1.35;color:var(--cd)}
.drop.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.drop.no{background:var(--no);border-color:var(--no);color:#fff;animation:shake .3s}
.ground{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--c);opacity:.25}
.lives{letter-spacing:2px}
/* builder */
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;min-height:64px;padding:10px;border-radius:18px}
.ans{background:var(--ivory);border:2px dashed var(--c);margin:14px 0 10px}
.tok{font-family:Amiri,serif;font-weight:700;font-size:1.45rem;background:#fff;border:2px solid var(--c);border-radius:14px;padding:4px 14px;color:var(--cd);box-shadow:0 3px 0 rgba(53,33,22,.15)}
.ans .tok{background:var(--champ);border-color:var(--gold)}
.ans.ok{border-color:var(--ok);background:#e6f5ee}.ans.no{border-color:var(--no);background:#fbe9e9;animation:shake .3s}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.timer b{display:block;height:100%;background:var(--c);width:100%}
/* ear */
.big{width:96px;height:96px;border-radius:50%;background:var(--c);color:#fff;font-size:2.4rem;display:flex;align-items:center;justify-content:center;margin:6px auto 4px;box-shadow:0 0 0 8px rgba(214,166,60,.3)}
.big.play{animation:pulse .8s infinite}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-family:Amiri,serif;direction:rtl;font-weight:700;font-size:1.35rem;line-height:1.4;color:var(--cd);text-align:center}
.opt.lat{font-family:Poppins,sans-serif;direction:ltr;font-size:1rem;font-weight:600}
.opt.ok{background:#e6f5ee;border-color:var(--ok)}.opt.no{background:#fbe9e9;border-color:var(--no)}
/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mc{position:relative;height:clamp(92px,22vw,130px);perspective:800px}
.mc .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.mc .fa{background:var(--c);border:3px solid var(--gold);color:var(--champ);font-size:1.8rem;font-weight:800}
.mc .ba{background:#fff;border:3px solid var(--c);transform:rotateY(180deg);font-size:.8rem;font-weight:600;line-height:1.25}
.mc .ba.ar{font-size:clamp(1rem,4vw,1.35rem);font-weight:700;line-height:1.35}
.mc.done .ba{background:#e6f5ee;border-color:var(--ok)}
/* feedback */
.fb{text-align:center;font-weight:700;min-height:1.6em;margin-top:10px}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:2rem;font-weight:800;color:var(--gold);pointer-events:none;animation:popup .8s ease-out both;z-index:50;text-shadow:0 2px 0 #fff}
/* end */
.end{text-align:center}
.end .stars{font-size:2.8rem;letter-spacing:6px;margin:6px 0}
.end .score{font-size:3rem;font-weight:800;color:var(--c);line-height:1}
.end .hs{color:var(--mut);font-size:.85rem;margin:4px 0 16px}
.cta{margin-top:18px;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;border-radius:22px;padding:18px;text-align:center}
.cta b{font-size:1.1rem}.cta p{font-size:.85rem;opacity:.9;margin:6px 0 12px}
.ctas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.musb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--gold);font-size:1.4rem;box-shadow:0 6px 16px rgba(53,33,22,.2)}
.musb.off{opacity:.55;filter:grayscale(1)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes popup{from{opacity:1;transform:translate(-50%,-30%) scale(.6)}to{opacity:0;transform:translate(-50%,-120%) scale(1.2)}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
.fadein{animation:fadein .35s ease both}

/* new games */
.ov{position:fixed;inset:0;z-index:55;background:rgba(30,20,12,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.qcard{position:relative;width:min(560px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:24px;padding:18px 16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:8px solid var(--c)}
.qcard small{display:block;color:var(--mut);font-size:.82rem;margin-top:4px}
.qt{font-weight:800;margin:0 26px 6px}
.qx{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--ivory);font-size:1rem}
.pic{font-size:clamp(3.6rem,16vw,5.4rem);line-height:1.15;margin:8px 0;letter-spacing:.06em;animation:pop2 .45s cubic-bezier(.2,1.5,.4,1) both}
.qmean{font-weight:700;font-size:1.1rem;margin:10px 0}
.emg{grid-template-columns:1fr 1fr}
.opt.emo{font-family:inherit;font-size:2.6rem;padding:14px 6px;direction:ltr}
.streak{font-weight:800;color:#e67e22;align-self:center}
.players{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.pl{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.88rem;transition:.2s}
.pl.on{border-color:var(--c);background:var(--c);color:#fff}
.board{position:relative;display:grid;grid-template-columns:repeat(6,1fr);border-radius:20px;overflow:hidden;border:3px solid var(--c);aspect-ratio:6/5;background:#fff}
.cell{position:relative;border:1px solid var(--line);background:var(--ivory);display:flex;align-items:center;justify-content:center}
.cell.alt{background:#fff}
.cell b{position:absolute;left:5px;top:3px;font-size:.7rem;color:var(--mut)}
.cell span{font-size:1.3rem;opacity:.8}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lr{stroke:#8a5a2b;stroke-width:6;stroke-linecap:round}.lg{stroke:#b07a43;stroke-width:5;stroke-linecap:round}
.sn{fill:none;stroke:#2e9e6a;stroke-width:13;stroke-linecap:round;opacity:.85}.sh{fill:#1f7a50}
.pc{position:absolute;font-size:clamp(1.5rem,6vw,2.1rem);transform:translate(0,-50%);transition:left .2s,top .2s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));z-index:3}
.dice{font-size:3rem;line-height:1;width:64px;text-align:center}
.sky{position:relative;height:min(56vh,480px);border-radius:24px;overflow:hidden;margin-top:12px;border:1px solid var(--line);background:linear-gradient(#bfe3ff,#eef8ff 70%,#fff)}
.sky::before{content:"☁️";position:absolute;left:8%;top:12%;font-size:2.6rem;opacity:.8}.sky::after{content:"☁️";position:absolute;right:10%;top:34%;font-size:2rem;opacity:.7}
.bal{position:absolute;bottom:-150px;width:22%;max-width:120px;aspect-ratio:4/5;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.7),transparent 30%),var(--bc);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;z-index:2}
.bal span{font-size:clamp(1.8rem,8vw,2.8rem);background:rgba(255,255,255,.85);border-radius:50%;width:72%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.bal::after{content:"";position:absolute;left:50%;bottom:-46px;width:2px;height:46px;background:rgba(0,0,0,.25)}
.bal.ok{outline:5px solid var(--ok);outline-offset:3px}
.bal.popd{animation:popb .35s ease-out forwards;pointer-events:none}
.bal.bad{--bc:#555}
@keyframes popb{60%{transform:scale(1.35);opacity:.8}100%{transform:scale(.1);opacity:0}}
@keyframes pop2{from{transform:scale(.3);opacity:0}}
.scene{position:relative;height:230px;border-radius:24px;overflow:hidden;margin-bottom:12px;background:linear-gradient(160deg,var(--champ),var(--ivory));border:1px solid var(--line)}
.bgem{position:absolute;right:-10px;bottom:-24px;font-size:9rem;opacity:.25}
.place{position:absolute;left:12px;top:10px;background:#fff;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.chr{position:absolute;left:12%;bottom:8px;font-size:5.4rem;line-height:1}
.prop{position:absolute;right:14%;bottom:18px;font-size:3rem}
.bub{position:absolute;left:34%;right:6%;top:42px;min-height:70px;background:#fff;border-radius:22px 22px 22px 6px;box-shadow:0 8px 20px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;padding:10px 14px;border:3px solid var(--c)}
.bub.said{animation:pop2 .4s both}
.bub .ar{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:700;line-height:1.4;color:var(--cd)}
.dots3{display:flex;gap:6px}.dots3 i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.4;animation:pulse 1s infinite}.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
.map{position:relative;height:min(70vh,620px);border-radius:24px;overflow:hidden;background:radial-gradient(circle at 20% 15%,#fff 0,transparent 40%),linear-gradient(#f9efd6,#efe0bd);border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.road{fill:none;stroke:#fff;stroke-width:26;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 34;opacity:.95}
.stn{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2}
.stn .se{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 8px 18px rgba(53,33,22,.2)}
.stn b{font-size:.78rem;background:#fff;border-radius:999px;padding:1px 10px}
.stn i{position:absolute;right:-4px;top:-4px;font-style:normal}
.stn.done .se{border-color:var(--ok)}.stn.lock{filter:grayscale(1);opacity:.6}
.stn:not(.lock):not(.done) .se{animation:pulse 1.4s infinite}
.pass{margin-top:10px;background:var(--c);color:#fff;border-radius:18px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pass div{display:flex;gap:6px}.stp{width:38px;height:38px;border-radius:50%;border:2px dashed rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.stp.on{background:#fff;border:2px solid var(--gold)}
.stcard{text-align:center;padding:40px 10px}.stcard .bigem{font-size:6rem}.stcard h2{font-size:1.6rem}
.stampbig{font-size:5rem;width:130px;height:130px;margin:0 auto 8px;border-radius:50%;border:6px double var(--ok);display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);animation:pop2 .5s both}
.stampbig.fail{border-color:var(--no)}
.gcard.new::after{content:"BARU";position:absolute;right:10px;top:10px;background:var(--gold);color:#2a1a0f;font-size:.62rem;font-weight:800;border-radius:999px;padding:2px 8px}

@media(min-width:620px){.games{grid-template-columns:repeat(3,1fr)}.mem{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bgc" style="right:-140px;top:-140px;width:360px;height:360px;background:var(--champ);opacity:.35"></div>
<div class="bgc" style="left:-160px;bottom:-160px;width:380px;height:380px;border:2px solid var(--gold);opacity:.4"></div>
<div id="app"></div>

const ITEMS=[{"n": "751", "ar": "إِلَى أَنْ نَلْتَقِيَ مَرَّةً أُخْرَى.", "tr": "Ilā an nalqiya marratan ukhrā.", "id": "Sampai kita bertemu lagi.", "t": 1, "em": ""}, {"n": "752", "ar": "كَيْفَ كَانَ يَوْمُكَ؟", "tr": "Kayfa kāna yawmuka?", "id": "Bagaimana harimu?", "t": 1, "em": ""}, {"n": "753", "ar": "مَا بِكَ؟ تَبْدُو مُتْعَبًا.", "tr": "Mā bika? Tabdū mutʿaban.", "id": "Kamu kenapa? Kelihatan capek.", "t": 1, "em": "😩"}, {"n": "754", "ar": "لَمْ أَرَكَ مُنْذُ مُدَّةٍ طَوِيلَةٍ.", "tr": "Lam araka mundhu muddatin ṭawīlatin.", "id": "Sudah lama saya tidak melihatmu.", "t": 1, "em": ""}, {"n": "755", "ar": "مَاذَا تَفْعَلُ هَذِهِ الْأَيَّامَ؟", "tr": "Mādhā tafʿalu hādhihi al-ayyāma?", "id": "Kamu sedang apa belakangan ini?", "t": 1, "em": ""}, {"n": "756", "ar": "سَلِّمْ لِي عَلَى أُسْرَتِكَ.", "tr": "Sallim lī ʿalā usratika.", "id": "Sampaikan salamku untuk keluargamu.", "t": 1, "em": "👨‍👩‍👧"}, {"n": "757", "ar": "تُشَرِّفُنِي زِيَارَتُكَ.", "tr": "Tusharrifunī ziyāratuka.", "id": "Kunjunganmu membuat saya merasa terhormat.", "t": 1, "em": ""}, {"n": "758", "ar": "تَفَضَّلْ بِالدُّخُولِ، الْبَيْتُ بَيْتُكَ.", "tr": "Tafaḍḍal bi-d-dukhūli, al-baytu baytuka.", "id": "Silakan masuk, anggap rumah sendiri.", "t": 1, "em": "🏠"}, {"n": "759", "ar": "هَلْ تُحِبُّ الشَّايَ أَمِ الْقَهْوَةَ؟", "tr": "Hal tuḥibbu ash-shāya ami al-qahwata?", "id": "Kamu suka teh atau kopi?", "t": 1, "em": "🍵☕"}, {"n": "760", "ar": "لَا تُتْعِبْ نَفْسَكَ.", "tr": "Lā tutʿib nafsaka.", "id": "Jangan repot-repot.", "t": 1, "em": ""}, {"n": "761", "ar": "هَذَا وَاجِبٌ عَلَيْنَا.", "tr": "Hādhā wājibun ʿalaynā.", "id": "Ini sudah kewajiban kami.", "t": 1, "em": ""}, {"n": "762", "ar": "أَعْتَذِرُ عَنْ إِزْعَاجِكَ.", "tr": "Aʿtadhiru ʿan izʿājika.", "id": "Maaf telah mengganggumu.", "t": 1, "em": ""}, {"n": "763", "ar": "هَلْ لَدَيْكَ دَقِيقَةٌ؟", "tr": "Hal ladayka daqīqatun?", "id": "Apakah kamu punya waktu sebentar?", "t": 1, "em": ""}, {"n": "764", "ar": "كَانَ وَقْتًا مُمْتِعًا مَعَكَ.", "tr": "Kāna waqtan mumtiʿan maʿaka.", "id": "Waktu bersamamu menyenangkan.", "t": 1, "em": ""}, {"n": "765", "ar": "أَتَمَنَّى أَنْ نَلْتَقِيَ قَرِيبًا.", "tr": "Atamannā an nalqiya qarīban.", "id": "Semoga kita segera bertemu.", "t": 1, "em": ""}, {"n": "766", "ar": "سَلَامِي لِلْجَمِيعِ.", "tr": "Salāmī lil-jamīʿi.", "id": "Salam saya untuk semuanya.", "t": 1, "em": ""}, {"n": "767", "ar": "اعْتَنِ بِنَفْسِكَ.", "tr": "Iʿtani bi-nafsika.", "id": "Jaga dirimu baik-baik.", "t": 1, "em": ""}, {"n": "768", "ar": "أُحِبُّ أَنْ أَكُونَ مُنَظَّمًا.", "tr": "Uḥibbu an akūna munaẓẓaman.", "id": "Saya suka menjadi orang yang teratur.", "t": 1, "em": ""}, {"n": "769", "ar": "أَنَا شَخْصٌ هَادِئٌ فِي الْغَالِبِ.", "tr": "Anā shakhṣun hādiʾun fī al-ghālibi.", "id": "Pada umumnya saya orang yang tenang.", "t": 1, "em": "😌"}, {"n": "770", "ar": "أَتَكَلَّمُ ثَلَاثَ لُغَاتٍ.", "tr": "Atakallamu thalātha lughātin.", "id": "Saya berbicara tiga bahasa.", "t": 1, "em": "🗣️"}, {"n": "771", "ar": "لَا أَحْمِلُ مَعِي أَشْيَاءَ كَثِيرَةً.", "tr": "Lā aḥmilu maʿī ashyāʾa kathīratan.", "id": "Saya tidak membawa banyak barang.", "t": 1, "em": ""}, {"n": "772", "ar": "أَعْمَلُ بِجِدٍّ لِأُحَقِّقَ أَهْدَافِي.", "tr": "Aʿmalu bi-jiddin li-uḥaqqiqa ahdāfī.", "id": "Saya bekerja keras untuk mencapai tujuan saya.", "t": 1, "em": ""}, {"n": "773", "ar": "أَهَمُّ شَيْءٍ عِنْدِي هُوَ أُسْرَتِي.", "tr": "Ahammu shayʾin ʿindī huwa usratī.", "id": "Hal terpenting bagi saya adalah keluarga saya.", "t": 1, "em": "👨‍👩‍👧"}, {"n": "774", "ar": "أَخْشَى مِنَ الْمُرْتَفَعَاتِ.", "tr": "Akhshā mina al-murtafaʿāti.", "id": "Saya takut ketinggian.", "t": 1, "em": "😨"}, {"n": "775", "ar": "أُحِبُّ الْهُدُوءَ أَكْثَرَ مِنَ الضَّجِيجِ.", "tr": "Uḥibbu al-hudūʾa akthara mina aḍ-ḍajīji.", "id": "Saya lebih suka ketenangan daripada keramaian.", "t": 1, "em": ""}, {"n": "776", "ar": "لَدَيَّ ذَاكِرَةٌ ضَعِيفَةٌ لِلْأَسْمَاءِ.", "tr": "Ladayya dhākiratun ḍaʿīfatun lil-asmāʾi.", "id": "Saya lemah dalam mengingat nama.", "t": 1, "em": ""}, {"n": "777", "ar": "أَتَعَلَّمُ بِسُرْعَةٍ عِنْدَمَا أَكْتُبُ.", "tr": "Ataʿallamu bi-surʿatin ʿindamā aktubu.", "id": "Saya belajar dengan cepat ketika menulis.", "t": 1, "em": "📚✍️"}, {"n": "778", "ar": "أَنَا مِنْ عَائِلَةٍ كَبِيرَةٍ.", "tr": "Anā min ʿāʾilatin kabīratin.", "id": "Saya berasal dari keluarga besar.", "t": 1, "em": "👨‍👩‍👧"}, {"n": "779", "ar": "اسْمِي الْكَامِلُ مُحَمَّدُ عَلِيٌّ.", "tr": "Ismī al-kāmilu Muḥammadu ʿAliyyun.", "id": "Nama lengkap saya Muhammad Ali.", "t": 1, "em": ""}, {"n": "780", "ar": "وُلِدْتُ فِي شَهْرِ مَايُو.", "tr": "Wulidtu fī shahri māyū.", "id": "Saya lahir di bulan Mei.", "t": 1, "em": ""}, {"n": "781", "ar": "أَنَا أَصْغَرُ إِخْوَتِي.", "tr": "Anā aṣgharu ikhwatī.", "id": "Saya yang paling muda di antara saudara-saudara saya.", "t": 1, "em": "🧑‍🤝‍🧑"}, {"n": "782", "ar": "أُشْبِهُ أُمِّي فِي الشَّكْلِ.", "tr": "Ushbihu ummī fī ash-shakli.", "id": "Saya mirip ibu saya dalam rupa.", "t": 1, "em": "👩"}, {"n": "783", "ar": "عِنْدِي عَادَةٌ سَيِّئَةٌ، وَهِيَ التَّأْخِيرُ.", "tr": "ʿIndī ʿādatun sayyiʾatun, wa-hiya at-taʾkhīru.", "id": "Saya punya kebiasaan buruk, yaitu terlambat.", "t": 1, "em": "⏰"}, {"n": "784", "ar": "عِنْدِي أَخٌ أَكْبَرُ مِنِّي.", "tr": "ʿIndī akhun akbaru minnī.", "id": "Saya punya kakak laki-laki yang lebih tua dari saya.", "t": 2, "em": "🧑‍🤝‍🧑"}, {"n": "785", "ar": "أُخْتِي أَصْغَرُ مِنِّي بِثَلَاثِ سَنَوَاتٍ.", "tr": "Ukhtī aṣgharu minnī bi-thalāthi sanawātin.", "id": "Adik perempuan saya tiga tahun lebih muda dari saya.", "t": 2, "em": "🧒"}, {"n": "786", "ar": "جَدِّي يَسْكُنُ فِي الْقَرْيَةِ.", "tr": "Jaddī yaskunu fī al-qaryati.", "id": "Kakek saya tinggal di desa.", "t": 2, "em": "👴🏡"}, {"n": "787", "ar": "تُحِبُّ جَدَّتِي أَنْ تَطْبُخَ لَنَا.", "tr": "Tuḥibbu jaddatī an taṭbukha lanā.", "id": "Nenek saya suka memasak untuk kami.", "t": 2, "em": "👵🍳"}, {"n": "788", "ar": "يَعْمَلُ أَبِي فِي مَصْنَعٍ.", "tr": "Yaʿmalu abī fī maṣnaʿin.", "id": "Ayah saya bekerja di pabrik.", "t": 2, "em": "👨🏭"}, {"n": "789", "ar": "تَعْمَلُ أُمِّي فِي مُسْتَشْفًى.", "tr": "Taʿmalu ummī fī mustashfan.", "id": "Ibu saya bekerja di rumah sakit.", "t": 2, "em": "👩🏠"}, {"n": "790", "ar": "نَجْتَمِعُ كُلَّ يَوْمِ جُمُعَةٍ فِي بَيْتِ جَدِّي.", "tr": "Najtamiʿu kulla yawmi jumʿatin fī bayti jaddī.", "id": "Kami berkumpul setiap hari Jumat di rumah kakek.", "t": 2, "em": "🏠👴"}, {"n": "791", "ar": "يَلْعَبُ الْأَطْفَالُ فِي الْحَدِيقَةِ بَعْدَ الْمَدْرَسَةِ.", "tr": "Yalʿabu al-aṭfālu fī al-ḥadīqati baʿda al-madrasati.", "id": "Anak-anak bermain di taman setelah sekolah.", "t": 2, "em": "🧒🌳"}, {"n": "792", "ar": "زَوْجِي يُسَاعِدُنِي فِي الْبَيْتِ.", "tr": "Zawjī yusāʿidunī fī al-bayti.", "id": "Suami saya membantu saya di rumah.", "t": 2, "em": "🤵🏠"}, {"n": "793", "ar": "أُحِبُّ أُسْرَتِي كَثِيرًا.", "tr": "Uḥibbu usratī kathīran.", "id": "Saya sangat mencintai keluarga saya.", "t": 2, "em": "👨‍👩‍👧"}, {"n": "794", "ar": "هَلْ لَدَيْكَ أَوْلَادٌ؟", "tr": "Hal ladayka awlādun?", "id": "Apakah kamu punya anak?", "t": 2, "em": "🧒"}, {"n": "795", "ar": "ابْنِي فِي الصَّفِّ الثَّالِثِ.", "tr": "Ibnī fī aṣ-ṣaffi ath-thālithi.", "id": "Anak laki-laki saya di kelas tiga.", "t": 2, "em": "🧒🏫"}, {"n": "796", "ar": "تَزَوَّجَ أَخِي السَّنَةَ الْمَاضِيَةَ.", "tr": "Tazawwaja akhī as-sanata al-māḍiyata.", "id": "Saudara laki-laki saya menikah tahun lalu.", "t": 2, "em": "🧑‍🤝‍🧑💍"}, {"n": "797", "ar": "وُلِدَ لَهُ طِفْلٌ جَدِيدٌ.", "tr": "Wulida lahu ṭiflun jadīdun.", "id": "Dia dikaruniai anak baru.", "t": 2, "em": "🧒"}, {"n": "798", "ar": "تَرْبِطُنِي بِصَدِيقِي صَدَاقَةٌ قَوِيَّةٌ.", "tr": "Tarbiṭunī bi-ṣadīqī ṣadāqatun qawiyyatun.", "id": "Saya dan teman saya memiliki persahabatan yang kuat.", "t": 2, "em": "🧑‍🤝‍🧑"}, {"n": "799", "ar": "أَقْضِي عُطْلَةَ نِهَايَةِ الْأُسْبُوعِ مَعَ أَصْدِقَائِي.", "tr": "Aqḍī ʿuṭlata nihāyati al-usbūʿi maʿa aṣdiqāʾī.", "id": "Saya menghabiskan akhir pekan bersama teman-teman.", "t": 2, "em": "🧑‍🤝‍🧑"}, {"n": "800", "ar": "هَذَا أَقْرَبُ أَصْدِقَائِي إِلَيَّ.", "tr": "Hādhā aqrabu aṣdiqāʾī ilayya.", "id": "Ini teman terdekat saya.", "t": 2, "em": "🧑‍🤝‍🧑"}, {"n": "801", "ar": "نَحْنُ نَعْرِفُ بَعْضَنَا مُنْذُ الطُّفُولَةِ.", "tr": "Naḥnu naʿrifu baʿḍanā mundhu aṭ-ṭufūlati.", "id": "Kami saling kenal sejak kecil.", "t": 2, "em": ""}, {"n": "802", "ar": "أُحِبُّ أَنْ أَزُورَ أَقَارِبِي فِي الْعِيدِ.", "tr": "Uḥibbu an azūra aqāribī fī al-ʿīdi.", "id": "Saya suka mengunjungi kerabat saat hari raya.", "t": 2, "em": "🎉"}, {"n": "803", "ar": "جَدَّتِي تَدْعُو لَنَا دَائِمًا.", "tr": "Jaddatī tadʿū lanā dāʾiman.", "id": "Nenek saya selalu mendoakan kami.", "t": 2, "em": "👵"}, {"n": "804", "ar": "أَبِي يَعْمَلُ كَثِيرًا مِنْ أَجْلِنَا.", "tr": "Abī yaʿmalu kathīran min ajlinā.", "id": "Ayah saya bekerja keras demi kami.", "t": 2, "em": "👨"}, {"n": "805", "ar": "أُمِّي تَطْبُخُ أَطْيَبَ طَعَامٍ.", "tr": "Ummī taṭbukhu aṭyaba ṭaʿāmin.", "id": "Ibu saya memasak makanan terenak.", "t": 2, "em": "👩🍳"}, {"n": "806", "ar": "أَخِي الصَّغِيرُ يُحِبُّ اللَّعِبَ كَثِيرًا.", "tr": "Akhī aṣ-ṣaghīru yuḥibbu al-laʿiba kathīran.", "id": "Adik laki-laki saya sangat suka bermain.", "t": 2, "em": "🧒"}, {"n": "807", "ar": "نَتَنَاوَلُ الْعَشَاءَ مَعًا كُلَّ لَيْلَةٍ.", "tr": "Natanāwalu al-ʿashāʾa maʿan kulla laylatin.", "id": "Kami makan malam bersama setiap malam.", "t": 2, "em": "🍲"}, {"n": "808", "ar": "أَيُّهُمَا أَكْبَرُ، أَنْتَ أَمْ أَخُوكَ؟", "tr": "Ayyuhumā akbaru, anta am akhūka?", "id": "Siapa yang lebih tua, kamu atau saudaramu?", "t": 2, "em": "🧑‍🤝‍🧑"}, {"n": "809", "ar": "تَزَوَّجَتْ أُخْتِي مِنْ رَجُلٍ طَيِّبٍ.", "tr": "Tazawwajat ukhtī min rajulin ṭayyibin.", "id": "Saudari saya menikah dengan pria yang baik.", "t": 2, "em": "💍"}, {"n": "810", "ar": "سَأُقِيمُ حَفْلَةً لِصَدِيقِي.", "tr": "Sa-uqīmu ḥaflatan li-ṣadīqī.", "id": "Saya akan mengadakan pesta untuk teman saya.", "t": 2, "em": "🎉🧑‍🤝‍🧑"}, {"n": "811", "ar": "دَعَوْتُ أَصْدِقَائِي إِلَى الْبَيْتِ.", "tr": "Daʿawtu aṣdiqāʾī ilā al-bayti.", "id": "Saya mengundang teman-teman ke rumah.", "t": 2, "em": "🧑‍🤝‍🧑🏠"}, {"n": "812", "ar": "جَاءَ الْجَمِيعُ فِي الْمَوْعِدِ.", "tr": "Jāʾa al-jamīʿu fī al-mawʿidi.", "id": "Semua orang datang tepat waktu.", "t": 2, "em": ""}, {"n": "813", "ar": "الصَّدِيقُ الْحَقِيقِيُّ يَقِفُ مَعَكَ.", "tr": "Aṣ-ṣadīqu al-ḥaqīqiyyu yaqifu maʿaka.", "id": "Teman sejati berdiri bersamamu.", "t": 2, "em": "🧑‍🤝‍🧑"}, {"n": "814", "ar": "هُوَ يُشْبِهُ أَبَاهُ كَثِيرًا.", "tr": "Huwa yushbihu abāhu kathīran.", "id": "Dia sangat mirip ayahnya.", "t": 2, "em": "👨"}, {"n": "815", "ar": "أُحِبُّ أَنْ أَسْتَمِعَ إِلَى نَصَائِحِ وَالِدَيَّ.", "tr": "Uḥibbu an astamiʿa ilā naṣāʾiḥi wālidayya.", "id": "Saya suka mendengarkan nasihat orang tua saya.", "t": 2, "em": ""}, {"n": "816", "ar": "أَحْيَانًا أَذْهَبُ إِلَى الْعَمَلِ مَشْيًا.", "tr": "Aḥyānan adhhabu ilā al-ʿamali mashyan.", "id": "Kadang saya berjalan kaki ke tempat kerja.", "t": 3, "em": "🦶"}, {"n": "817", "ar": "بَيْتُنَا قَرِيبٌ مِنَ الْمَدْرَسَةِ.", "tr": "Baytunā qarībun mina al-madrasati.", "id": "Rumah kami dekat dari sekolah.", "t": 3, "em": "🏠🏫"}, {"n": "818", "ar": "نَسْكُنُ فِي شَقَّةٍ صَغِيرَةٍ.", "tr": "Naskunu fī shaqqatin ṣaghīratin.", "id": "Kami tinggal di apartemen kecil.", "t": 3, "em": "🏢"}, {"n": "819", "ar": "غُرْفَتِي فِيهَا سَرِيرٌ وَمَكْتَبٌ.", "tr": "Ghurfatī fīhā sarīrun wa-maktabun.", "id": "Di kamar saya ada tempat tidur dan meja.", "t": 3, "em": "🛏️😴"}, {"n": "820", "ar": "أُرَتِّبُ غُرْفَتِي كُلَّ أُسْبُوعٍ.", "tr": "Urattibu ghurfatī kulla usbūʿin.", "id": "Saya merapikan kamar saya setiap minggu.", "t": 3, "em": "🛏️📅"}, {"n": "821", "ar": "هَلْ تُرِيدُ أَنْ تَرَى بَيْتِي؟", "tr": "Hal turīdu an tarā baytī?", "id": "Maukah kamu melihat rumah saya?", "t": 3, "em": "🏠"}, {"n": "822", "ar": "الْمَطْبَخُ هُوَ مَكَانِي الْمُفَضَّلُ.", "tr": "Al-maṭbakhu huwa makānī al-mufaḍḍalu.", "id": "Dapur adalah tempat favorit saya.", "t": 3, "em": "🍳"}, {"n": "823", "ar": "فِي غُرْفَةِ الْجُلُوسِ أَرِيكَةٌ كَبِيرَةٌ.", "tr": "Fī ghurfati al-julūsi arīkatun kabīratun.", "id": "Di ruang tamu ada sofa besar.", "t": 3, "em": "🙋"}, {"n": "824", "ar": "نُشَاهِدُ التِّلْفَازَ مَعًا فِي الْمَسَاءِ.", "tr": "Nushāhidu at-tilfāza maʿan fī al-masāʾi.", "id": "Kami menonton TV bersama di malam hari.", "t": 3, "em": "📺🌙"}, {"n": "825", "ar": "أُنَظِّفُ الْبَيْتَ كُلَّ سَبْتٍ.", "tr": "Unaẓẓifu al-bayta kulla sabtin.", "id": "Saya membersihkan rumah setiap hari Sabtu.", "t": 3, "em": "🏠"}, {"n": "826", "ar": "يَجِبُ أَنْ نُنَظِّفَ الْمَطْبَخَ الْآنَ.", "tr": "Yajibu an nunaẓẓifa al-maṭbakha al-āna.", "id": "Kita harus membersihkan dapur sekarang.", "t": 3, "em": "🍳"}, {"n": "827", "ar": "وَضَعْتُ الْكُتُبَ عَلَى الرَّفِّ.", "tr": "Waḍaʿtu al-kutuba ʿalā ar-raffi.", "id": "Saya menaruh buku-buku di rak.", "t": 3, "em": "📖"}, {"n": "828", "ar": "أَيْنَ وَضَعْتَ مِفْتَاحَ السَّيَّارَةِ؟", "tr": "Ayna waḍaʿta miftāḥa as-sayyārati?", "id": "Di mana kamu menaruh kunci mobil?", "t": 3, "em": "🔑🚗"}, {"n": "829", "ar": "أَغْلَقْتُ النَّوَافِذَ قَبْلَ النَّوْمِ.", "tr": "Aghlaqtu an-nawāfidha qabla an-nawmi.", "id": "Saya menutup jendela sebelum tidur.", "t": 3, "em": "🪟😴"}, {"n": "830", "ar": "نَسِيتُ أَنْ أُطْفِئَ الضَّوْءَ.", "tr": "Nasītu an uṭfiʾa aḍ-ḍawʾa.", "id": "Saya lupa mematikan lampu.", "t": 3, "em": "💡"}, {"n": "831", "ar": "الْجِيرَانُ هَادِئُونَ جِدًّا.", "tr": "Al-jīrānu hādiʾūna jiddan.", "id": "Para tetangga sangat tenang.", "t": 3, "em": "🏘️😌"}, {"n": "832", "ar": "يُحِبُّ جَارُنَا الْقِطَطَ.", "tr": "Yuḥibbu jāruna al-qiṭaṭa.", "id": "Tetangga kami suka kucing.", "t": 3, "em": "🏘️🐱"}, {"n": "833", "ar": "أُرِيدُ أَنْ أَسْتَرِيحَ قَلِيلًا.", "tr": "Urīdu an astarīḥa qalīlan.", "id": "Saya ingin istirahat sebentar.", "t": 3, "em": "🛋️"}, {"n": "834", "ar": "انْتَقَلْنَا إِلَى بَيْتٍ جَدِيدٍ.", "tr": "Intaqalnā ilā baytin jadīdin.", "id": "Kami pindah ke rumah baru.", "t": 3, "em": "🏠"}, {"n": "835", "ar": "الْبَيْتُ الْجَدِيدُ أَوْسَعُ مِنَ الْقَدِيمِ.", "tr": "Al-baytu al-jadīdu awsaʿu mina al-qadīmi.", "id": "Rumah baru lebih luas daripada yang lama.", "t": 3, "em": "🏠"}, {"n": "836", "ar": "يُوجَدُ فِي الْبَيْتِ حَمَّامَانِ.", "tr": "Yūjadu fī al-bayti ḥammāmāni.", "id": "Di rumah ada dua kamar mandi.", "t": 3, "em": "🏠🚿"}, {"n": "837", "ar": "أَحْتَاجُ إِلَى مَكْتَبٍ لِلدِّرَاسَةِ.", "tr": "Aḥtāju ilā maktabin lil-dirāsati.", "id": "Saya butuh meja untuk belajar.", "t": 3, "em": "🪑📚"}, {"n": "838", "ar": "اشْتَرَيْنَا أَثَاثًا جَدِيدًا لِلْغُرْفَةِ.", "tr": "Ishtaraynā athāthan jadīdan lil-ghurfati.", "id": "Kami membeli perabot baru untuk kamar.", "t": 3, "em": "🛍️🛏️"}, {"n": "839", "ar": "أُنَظِّفُ النَّوَافِذَ كُلَّ شَهْرٍ.", "tr": "Unaẓẓifu an-nawāfidha kulla shahrin.", "id": "Saya membersihkan jendela setiap bulan.", "t": 3, "em": "🪟"}, {"n": "840", "ar": "الْمِصْعَدُ لَا يَعْمَلُ الْيَوْمَ.", "tr": "Al-miṣʿadu lā yaʿmalu al-yawma.", "id": "Liftnya tidak berfungsi hari ini.", "t": 3, "em": "📅"}, {"n": "841", "ar": "نَسْكُنُ فِي الطَّابِقِ الرَّابِعِ.", "tr": "Naskunu fī aṭ-ṭābiqi ar-rābiʿi.", "id": "Kami tinggal di lantai empat.", "t": 3, "em": ""}, {"n": "842", "ar": "الْجِيرَانُ يُسَاعِدُونَنَا دَائِمًا.", "tr": "Al-jīrānu yusāʿidūnanā dāʾiman.", "id": "Para tetangga selalu membantu kami.", "t": 3, "em": "🏘️"}, {"n": "843", "ar": "قَدَّمْتُ لِجَارِي هَدِيَّةً صَغِيرَةً.", "tr": "Qaddamtu li-jārī hadiyyatan ṣaghīratan.", "id": "Saya memberi tetangga saya hadiah kecil.", "t": 3, "em": "🏘️🎁"}, {"n": "844", "ar": "يَرْفَعُونَ الصَّوْتَ فِي اللَّيْلِ.", "tr": "Yarfaʿūna aṣ-ṣawta fī al-layli.", "id": "Mereka bersuara keras di malam hari.", "t": 3, "em": "🌙"}, {"n": "845", "ar": "طَلَبْتُ مِنْهُمْ أَنْ يَهْدَؤُوا.", "tr": "Ṭalabtu minhum an yahdaʾū.", "id": "Saya meminta mereka untuk tenang.", "t": 3, "em": "😌"}, {"n": "846", "ar": "دَفَعْتُ الْإِيجَارَ هَذَا الشَّهْرَ.", "tr": "Dafaʿtu al-ījāra hādhā ash-shahra.", "id": "Saya membayar sewa bulan ini.", "t": 3, "em": "💳🔑"}, {"n": "847", "ar": "نَحْتَاجُ إِلَى إِصْلَاحِ الْمِصْبَاحِ.", "tr": "Naḥtāju ilā iṣlāḥi al-miṣbāḥi.", "id": "Kami perlu memperbaiki lampu.", "t": 3, "em": "💡"}, {"n": "848", "ar": "هَلْ يُمْكِنُكَ أَنْ تُصْلِحَ الصُّنْبُورَ؟", "tr": "Hal yumkinuka an tuṣliḥa aṣ-ṣunbūra?", "id": "Bisakah kamu memperbaiki keran?", "t": 3, "em": ""}, {"n": "849", "ar": "الْحَدِيقَةُ تَحْتَاجُ إِلَى سَقْيٍ.", "tr": "Al-ḥadīqatu taḥtāju ilā saqyin.", "id": "Tamannya perlu disiram.", "t": 3, "em": "🌳"}, {"n": "850", "ar": "عَادَةً أَسْتَيْقِظُ قَبْلَ السَّادِسَةِ.", "tr": "ʿĀdatan astayqiẓu qabla as-sādisati.", "id": "Biasanya saya bangun sebelum jam enam.", "t": 4, "em": "⏰"}, {"n": "851", "ar": "نَادِرًا مَا أَتَنَاوَلُ الْفَطُورَ فِي الْبَيْتِ.", "tr": "Nādiran mā atanāwalu al-faṭūra fī al-bayti.", "id": "Saya jarang sarapan di rumah.", "t": 4, "em": "🥐🏠"}, {"n": "852", "ar": "دَائِمًا أَحْمِلُ زُجَاجَةَ مَاءٍ.", "tr": "Dāʾiman aḥmilu zujājata māʾin.", "id": "Saya selalu membawa botol air.", "t": 4, "em": "💧"}, {"n": "853", "ar": "أَقْرَأُ الْأَخْبَارَ كُلَّ صَبَاحٍ.", "tr": "Aqraʾu al-akhbāra kulla ṣabāḥin.", "id": "Saya membaca berita setiap pagi.", "t": 4, "em": "📖📰"}, {"n": "854", "ar": "غَالِبًا أَذْهَبُ إِلَى السُّوقِ يَوْمَ السَّبْتِ.", "tr": "Ghāliban adhhabu ilā as-sūqi yawma as-sabti.", "id": "Biasanya saya pergi ke pasar hari Sabtu.", "t": 4, "em": "🛒"}, {"n": "855", "ar": "لَا أَسْهَرُ كَثِيرًا.", "tr": "Lā ashharu kathīran.", "id": "Saya tidak sering begadang.", "t": 4, "em": ""}, {"n": "856", "ar": "أَشْرَبُ الشَّايَ بَعْدَ الْعَصْرِ.", "tr": "Ashrabu ash-shāya baʿda al-ʿaṣri.", "id": "Saya minum teh setelah asar.", "t": 4, "em": "🥤🍵"}, {"n": "857", "ar": "أُصَلِّي الْجُمُعَةَ مَعَ أَبِي.", "tr": "Uṣallī al-jumʿata maʿa abī.", "id": "Saya salat Jumat bersama ayah saya.", "t": 4, "em": "👨"}, {"n": "858", "ar": "نَزُورُ الْجَدَّةَ كُلَّ أُسْبُوعَيْنِ.", "tr": "Nazūru al-jaddata kulla usbūʿayni.", "id": "Kami mengunjungi nenek setiap dua minggu.", "t": 4, "em": "👵📅"}, {"n": "859", "ar": "أُرَتِّبُ جَدْوَلِي كُلَّ أُسْبُوعٍ.", "tr": "Urattibu jadwalī kulla usbūʿin.", "id": "Saya menyusun jadwal saya setiap minggu.", "t": 4, "em": "📅"}, {"n": "860", "ar": "لَا أَنَامُ قَبْلَ أَنْ أُرَاجِعَ دُرُوسِي.", "tr": "Lā anāmu qabla an urājiʿa durūsī.", "id": "Saya tidak tidur sebelum mengulang pelajaran.", "t": 4, "em": "😴📘"}, {"n": "861", "ar": "أَمْشِي إِلَى الْمَسْجِدِ بَعْدَ الْمَغْرِبِ.", "tr": "Amshī ilā al-masjidi baʿda al-maghribi.", "id": "Saya berjalan ke masjid setelah magrib.", "t": 4, "em": ""}, {"n": "862", "ar": "كُلَّ مَسَاءٍ أَتَحَدَّثُ مَعَ أَخِي.", "tr": "Kulla masāʾin ataḥaddathu maʿa akhī.", "id": "Setiap sore saya mengobrol dengan saudara saya.", "t": 4, "em": "🧑‍🤝‍🧑"}, {"n": "863", "ar": "أُحِبُّ أَنْ أَبْدَأَ يَوْمِي بِكُوبِ قَهْوَةٍ.", "tr": "Uḥibbu an abdaʾa yawmī bi-kūbi qahwatin.", "id": "Saya suka mengawali hari dengan secangkir kopi.", "t": 4, "em": "☕"}, {"n": "864", "ar": "لَيْسَ عِنْدِي وَقْتٌ لِلْفَطُورِ فِي الصَّبَاحِ.", "tr": "Laysa ʿindī waqtun lil-faṭūri fī aṣ-ṣabāḥi.", "id": "Saya tidak punya waktu sarapan di pagi hari.", "t": 4, "em": "🥐🌅"}, {"n": "865", "ar": "أُحَاوِلُ أَنْ أَنَامَ ثَمَانِيَ سَاعَاتٍ.", "tr": "Uḥāwilu an anāma thamāniya sāʿātin.", "id": "Saya berusaha tidur delapan jam.", "t": 4, "em": "😴⏰"}, {"n": "866", "ar": "ذَهَبْتُ إِلَى السُّوقِ أَمْسِ.", "tr": "Dhahabtu ilā as-sūqi amsi.", "id": "Kemarin saya pergi ke pasar.", "t": 5, "em": "📅🛒"}, {"n": "867", "ar": "مَاذَا فَعَلْتَ أَمْسِ؟", "tr": "Mādhā faʿalta amsi?", "id": "Apa yang kamu lakukan kemarin?", "t": 5, "em": "📅"}, {"n": "868", "ar": "زُرْتُ جَدِّي فِي الْقَرْيَةِ.", "tr": "Zurtu jaddī fī al-qaryati.", "id": "Saya mengunjungi kakek saya di desa.", "t": 5, "em": "👴🏡"}, {"n": "869", "ar": "أَكَلْتُ الْغَدَاءَ مَعَ أُسْرَتِي.", "tr": "Akaltu al-ghadāʾa maʿa usratī.", "id": "Saya makan siang bersama keluarga saya.", "t": 5, "em": "🍱👨‍👩‍👧"}, {"n": "870", "ar": "شَاهَدْنَا فِيلْمًا جَمِيلًا.", "tr": "Shāhadnā fīlman jamīlan.", "id": "Kami menonton film yang bagus.", "t": 5, "em": "🎬"}, {"n": "871", "ar": "نِمْتُ مُتَأَخِّرًا لِأَنِّي كُنْتُ أَدْرُسُ.", "tr": "Nimtu mutaʾakhkhiran li-annī kuntu adrusu.", "id": "Saya tidur larut karena saya sedang belajar.", "t": 5, "em": "😴📚"}, {"n": "872", "ar": "اسْتَيْقَظْتُ الْيَوْمَ فِي السَّادِسَةِ.", "tr": "Istayqaẓtu al-yawma fī as-sādisati.", "id": "Hari ini saya bangun jam enam.", "t": 5, "em": "📅⏰"}, {"n": "873", "ar": "وَصَلْتُ إِلَى الْمَدْرَسَةِ مُبَكِّرًا.", "tr": "Waṣaltu ilā al-madrasati mubakkiran.", "id": "Saya tiba di sekolah lebih awal.", "t": 5, "em": "🏫"}, {"n": "874", "ar": "تَأَخَّرْتُ عَنِ الْحَافِلَةِ.", "tr": "Taʾakhkhartu ʿani al-ḥāfilati.", "id": "Saya ketinggalan bus.", "t": 5, "em": "🚌"}, {"n": "875", "ar": "مَاذَا أَكَلْتَ فِي الْفَطُورِ؟", "tr": "Mādhā akalta fī al-faṭūri?", "id": "Apa yang kamu makan saat sarapan?", "t": 5, "em": "🍽️🥐"}, {"n": "876", "ar": "قَابَلْتُ صَدِيقِي الْقَدِيمَ.", "tr": "Qābaltu ṣadīqī al-qadīma.", "id": "Saya bertemu teman lama saya.", "t": 5, "em": "🧑‍🤝‍🧑"}, {"n": "877", "ar": "تَحَدَّثْنَا لِسَاعَتَيْنِ.", "tr": "Taḥaddathnā li-sāʿatayni.", "id": "Kami mengobrol selama dua jam.", "t": 5, "em": "⏰"}, {"n": "878", "ar": "اشْتَرَيْتُ حِذَاءً جَدِيدًا الْأُسْبُوعَ الْمَاضِيَ.", "tr": "Ishtaraytu ḥidhāʾan jadīdan al-usbūʿa al-māḍiya.", "id": "Minggu lalu saya membeli sepatu baru.", "t": 5, "em": "📅🛍️"}, {"n": "879", "ar": "كَانَ الطَّقْسُ جَمِيلًا أَمْسِ.", "tr": "Kāna aṭ-ṭaqsu jamīlan amsi.", "id": "Cuacanya bagus kemarin.", "t": 5, "em": "📅"}, {"n": "880", "ar": "لَمْ أَذْهَبْ إِلَى الْعَمَلِ الْيَوْمَ.", "tr": "Lam adhhab ilā al-ʿamali al-yawma.", "id": "Hari ini saya tidak pergi kerja.", "t": 5, "em": "📅"}, {"n": "881", "ar": "لَمْ أَفْهَمِ السُّؤَالَ.", "tr": "Lam afhami as-suʾāla.", "id": "Saya tidak mengerti pertanyaannya.", "t": 5, "em": ""}, {"n": "882", "ar": "هَلْ أَنْهَيْتَ وَاجِبَكَ؟", "tr": "Hal anhayta wājibaka?", "id": "Apakah kamu sudah menyelesaikan PR-mu?", "t": 5, "em": "📝"}, {"n": "883", "ar": "أَيْنَ كُنْتَ؟", "tr": "Ayna kunta?", "id": "Kamu tadi di mana?", "t": 5, "em": ""}, {"n": "884", "ar": "كُنْتُ فِي الْمَكْتَبَةِ أَقْرَأُ.", "tr": "Kuntu fī al-maktabati aqraʾu.", "id": "Saya tadi di perpustakaan sedang membaca.", "t": 5, "em": "📚📖"}, {"n": "885", "ar": "لَقَدْ نَسِيتُ مِفْتَاحِي.", "tr": "Laqad nasītu miftāḥī.", "id": "Saya lupa (membawa) kunci saya.", "t": 5, "em": "🔑"}, {"n": "886", "ar": "ضَاعَ مِنِّي هَاتِفِي.", "tr": "Ḍāʿa minnī hātifī.", "id": "Ponsel saya hilang.", "t": 5, "em": "📱🔍"}, {"n": "887", "ar": "وَجَدْتُ مِحْفَظَتِي أَخِيرًا.", "tr": "Wajadtu miḥfaẓatī akhīran.", "id": "Akhirnya saya menemukan dompet saya.", "t": 5, "em": ""}, {"n": "888", "ar": "سَمِعْتُ صَوْتًا غَرِيبًا.", "tr": "Samiʿtu ṣawtan gharīban.", "id": "Saya mendengar suara aneh.", "t": 5, "em": ""}, {"n": "889", "ar": "رَأَيْتُ أَخِي فِي السُّوقِ.", "tr": "Raʾaytu akhī fī as-sūqi.", "id": "Saya melihat saudara saya di pasar.", "t": 5, "em": "🧑‍🤝‍🧑🛒"}, {"n": "890", "ar": "اتَّصَلَتْ بِي أُمِّي صَبَاحًا.", "tr": "Ittaṣalat bī ummī ṣabāḥan.", "id": "Ibu saya menelepon saya tadi pagi.", "t": 5, "em": "👩🌅"}, {"n": "891", "ar": "قَالَ لِي أَبِي أَنْ أَنْتَبِهَ.", "tr": "Qāla lī abī an antabiha.", "id": "Ayah berkata kepada saya agar berhati-hati.", "t": 5, "em": "👨"}, {"n": "892", "ar": "أَعْطَانِي أَخِي هَدِيَّةً.", "tr": "Aʿṭānī akhī hadiyyatan.", "id": "Saudara saya memberi saya hadiah.", "t": 5, "em": "🧑‍🤝‍🧑🎁"}, {"n": "893", "ar": "أَرْسَلْتُ رِسَالَةً إِلَى صَدِيقِي.", "tr": "Arsaltu risālatan ilā ṣadīqī.", "id": "Saya mengirim pesan kepada teman saya.", "t": 5, "em": "🧑‍🤝‍🧑"}, {"n": "894", "ar": "كَتَبْتُ لَهُ بِالْعَرَبِيَّةِ.", "tr": "Katabtu lahu bi-l-ʿarabiyyati.", "id": "Saya menulis kepadanya dalam bahasa Arab.", "t": 5, "em": "✍️🗣️"}, {"n": "895", "ar": "قَرَأْتُ كِتَابًا عَنِ التَّارِيخِ.", "tr": "Qaraʾtu kitāban ʿani at-tārīkhi.", "id": "Saya membaca buku tentang sejarah.", "t": 5, "em": "📖"}, {"n": "896", "ar": "عِنْدَمَا كُنْتُ صَغِيرًا كُنْتُ أَسْكُنُ فِي قَرْيَةٍ.", "tr": "ʿIndamā kuntu ṣaghīran kuntu askunu fī qaryatin.", "id": "Ketika saya kecil, saya tinggal di sebuah desa.", "t": 5, "em": "🏡"}, {"n": "897", "ar": "وُلِدْتُ فِي مَدِينَةٍ صَغِيرَةٍ.", "tr": "Wulidtu fī madīnatin ṣaghīratin.", "id": "Saya lahir di kota kecil.", "t": 5, "em": "🏙️"}, {"n": "898", "ar": "كُنْتُ طَالِبًا فِي جَامِعَةِ جَاكَرْتَا.", "tr": "Kuntu ṭāliban fī jāmiʿati Jākartā.", "id": "Dulu saya mahasiswa di Universitas Jakarta.", "t": 5, "em": "🧑‍🎓🎓"}, {"n": "899", "ar": "عِشْتُ فِي الْقَاهِرَةِ لِمُدَّةِ سَنَتَيْنِ.", "tr": "ʿIshtu fī al-Qāhirati li-muddati sanatayni.", "id": "Saya tinggal di Kairo selama dua tahun.", "t": 5, "em": ""}, {"n": "900", "ar": "تَعَلَّمْتُ السِّبَاحَةَ فِي الصِّغَرِ.", "tr": "Taʿallamtu as-sibāḥata fī aṣ-ṣighari.", "id": "Saya belajar berenang waktu kecil.", "t": 5, "em": "📚🏊"}, {"n": "901", "ar": "كَانَ جَدِّي يَحْكِي لَنَا قِصَصًا كُلَّ لَيْلَةٍ.", "tr": "Kāna jaddī yaḥkī lanā qiṣaṣan kulla laylatin.", "id": "Dulu kakek menceritakan kisah-kisah kepada kami setiap malam.", "t": 5, "em": "👴🌙"}, {"n": "902", "ar": "أَمْضَيْنَا الْعُطْلَةَ الْمَاضِيَةَ عِنْدَ الْبَحْرِ.", "tr": "Amḍaynā al-ʿuṭlata al-māḍiyata ʿinda al-baḥri.", "id": "Kami menghabiskan liburan lalu di laut.", "t": 5, "em": "🏖️🌊"}, {"n": "903", "ar": "فِي الْعَامِ الْمَاضِي زُرْتُ مَكَّةَ لِلْعُمْرَةِ.", "tr": "Fī al-ʿāmi al-māḍī zurtu Makkata lil-ʿumrati.", "id": "Tahun lalu saya mengunjungi Mekah untuk umrah.", "t": 5, "em": ""}, {"n": "904", "ar": "لَمْ أَكُنْ أُحِبُّ الْخُضَارَ، لَكِنَّنِي الْآنَ أُحِبُّهَا.", "tr": "Lam akun uḥibbu al-khuḍāra, lakinnanī al-āna uḥibbuhā.", "id": "Dulu saya tidak suka sayuran, tapi sekarang suka.", "t": 5, "em": "🥦"}, {"n": "905", "ar": "سَقَطْتُ مِنَ الدَّرَّاجَةِ أَمْسِ.", "tr": "Saqaṭtu mina ad-darrājati amsi.", "id": "Kemarin saya jatuh dari sepeda.", "t": 5, "em": "📅🚲"}, {"n": "906", "ar": "كَسَرْتُ الْكُوبَ دُونَ قَصْدٍ.", "tr": "Kasartu al-kūba dūna qaṣdin.", "id": "Saya memecahkan gelas tanpa sengaja.", "t": 5, "em": ""}, {"n": "907", "ar": "الْتَقَيْنَا أَوَّلَ مَرَّةٍ فِي الْجَامِعَةِ.", "tr": "Iltaqaynā awwala marratin fī al-jāmiʿati.", "id": "Kami pertama kali bertemu di universitas.", "t": 5, "em": "🎓"}, {"n": "908", "ar": "مَا زِلْتُ أَتَذَكَّرُ ذَلِكَ الْيَوْمَ.", "tr": "Mā ziltu atadhakkaru dhālika al-yawma.", "id": "Saya masih ingat hari itu.", "t": 5, "em": ""}, {"n": "909", "ar": "قَضَيْتُ الصَّيْفَ كُلَّهُ فِي الْقَرْيَةِ.", "tr": "Qaḍaytu aṣ-ṣayfa kullahu fī al-qaryati.", "id": "Saya menghabiskan seluruh musim panas di desa.", "t": 5, "em": "☀️🏡"}, {"n": "910", "ar": "دَرَسْتُ الْإِنْجْلِيزِيَّةَ قَبْلَ الْعَرَبِيَّةِ.", "tr": "Darastu al-injlīziyyata qabla al-ʿarabiyyati.", "id": "Saya belajar bahasa Inggris sebelum bahasa Arab.", "t": 5, "em": "📚🗣️"}, {"n": "911", "ar": "مَاذَا حَدَثَ؟", "tr": "Mādhā ḥadatha?", "id": "Apa yang terjadi?", "t": 5, "em": ""}, {"n": "912", "ar": "مَاذَا كُنْتَ تَفْعَلُ عِنْدَمَا اتَّصَلْتُ بِكَ؟", "tr": "Mādhā kunta tafʿalu ʿindamā ittaṣaltu bika?", "id": "Kamu sedang apa ketika saya menelepon?", "t": 5, "em": ""}, {"n": "913", "ar": "كُنْتُ أَنَامُ عِنْدَمَا رَنَّ الْجَرَسُ.", "tr": "Kuntu anāmu ʿindamā ranna al-jarasu.", "id": "Saya sedang tidur ketika bel berbunyi.", "t": 5, "em": "😴"}, {"n": "914", "ar": "بَعْدَ أَنْ تَخَرَّجْتُ عَمِلْتُ فِي شَرِكَةٍ.", "tr": "Baʿda an takharrajtu ʿamiltu fī sharikatin.", "id": "Setelah lulus saya bekerja di sebuah perusahaan.", "t": 5, "em": ""}, {"n": "915", "ar": "قَبْلَ سَنَوَاتٍ كَانَتِ الْحَيَاةُ أَبْسَطَ.", "tr": "Qabla sanawātin kānat al-ḥayātu abṣaṭa.", "id": "Beberapa tahun lalu hidup lebih sederhana.", "t": 5, "em": ""}, {"n": "916", "ar": "لَمْ أَنْسَ يَوْمَ زَوَاجِي.", "tr": "Lam ansa yawma zawājī.", "id": "Saya tidak melupakan hari pernikahan saya.", "t": 5, "em": "💍"}, {"n": "917", "ar": "خَرَجْتُ مِنَ الْبَيْتِ فِي السَّابِعَةِ.", "tr": "Kharajtu mina al-bayti fī as-sābiʿati.", "id": "Saya keluar rumah jam tujuh.", "t": 6, "em": "🏠⏰"}, {"n": "918", "ar": "رَكِبْتُ الْحَافِلَةَ ثُمَّ نَزَلْتُ عِنْدَ الْجَامِعَةِ.", "tr": "Rakibtu al-ḥāfilata thumma nazal قُ وَأَعَادَهُ إِلَيَّ.", "tr": "Wajadahu as-sāʾiqu wa-aʿādahu ilayya.", "id": "Sopir menemukannya dan mengembalikannya kepada saya.", "t": 6, "em": "🚕"}, {"n": "931", "ar": "شَكَرْتُهُ كَثِيرًا.", "tr": "Shakartuhu kathīran.", "id": "Saya berterima kasih banyak kepadanya.", "t": 6, "em": ""}, {"n": "932", "ar": "ذَهَبْنَا إِلَى الْمَطْعَمِ مَعًا.", "tr": "Dhahabnā ilā al-maṭʿami maʿan.", "id": "Kami pergi ke restoran bersama.", "t": 6, "em": "🍽️"}, {"n": "933", "ar": "أَمْضَيْنَا السَّهْرَةَ فِي الْحَدِيثِ.", "tr": "Amḍaynā as-sahrata fī al-ḥadīthi.", "id": "Kami menghabiskan malam dengan mengobrol.", "t": 6, "em": "🌙"}, {"n": "934", "ar": "لَمْ أَشْعُرْ بِالْوَقْتِ.", "tr": "Lam ashʿur bi-l-waqti.", "id": "Saya tidak sadar akan waktu.", "t": 6, "em": ""}, {"n": "935", "ar": "سَأَذْهَبُ إِلَى الْمَسْجِدِ غَدًا.", "tr": "Sa-adhhabu ilā al-masjidi ghadan.", "id": "Besok saya akan pergi ke masjid.", "t": 7, "em": "📅"}, {"n": "936", "ar": "سَأَزُورُ عَمَّتِي يَوْمَ الْجُمُعَةِ.", "tr": "Sa-azūru ʿammatī yawma al-jumʿati.", "id": "Hari Jumat saya akan mengunjungi bibi saya.", "t": 7, "em": ""}, {"n": "937", "ar": "سَوْفَ أُسَافِرُ الشَّهْرَ الْقَادِمَ.", "tr": "Sawfa usāfiru ash-shahra al-qādima.", "id": "Bulan depan saya akan bepergian.", "t": 7, "em": ""}, {"n": "938", "ar": "مَاذَا سَتَفْعَلُ فِي نِهَايَةِ الْأُسْبُوعِ؟", "tr": "Mādhā sa-tafʿalu fī nihāyati al-usbūʿi?", "id": "Apa yang akan kamu lakukan akhir pekan ini?", "t": 7, "em": ""}, {"n": "939", "ar": "سَأَرْتَاحُ فِي الْبَيْتِ.", "tr": "Sa-artāḥu fī al-bayti.", "id": "Saya akan beristirahat di rumah.", "t": 7, "em": "🏠"}, {"n": "940", "ar": "سَنَلْعَبُ كُرَةَ الْقَدَمِ بَعْدَ الظُّهْرِ.", "tr": "Sa-nalʿabu kurata al-qadami baʿda aẓ-ẓuhri.", "id": "Kami akan main sepak bola setelah siang.", "t": 7, "em": "⚽🌞"}, {"n": "941", "ar": "سَيَأْتِي أَصْدِقَائِي غَدًا.", "tr": "Sa-yaʾtī aṣdiqāʾī ghadan.", "id": "Teman-teman saya akan datang besok.", "t": 7, "em": "🧑‍🤝‍🧑📅"}, {"n": "942", "ar": "سَأُحَضِّرُ الْعَشَاءَ الْيَوْمَ.", "tr": "Sa-uḥaḍḍiru al-ʿashāʾa al-yawma.", "id": "Hari ini saya akan menyiapkan makan malam.", "t": 7, "em": "📅🍲"}, {"n": "943", "ar": "هَلْ سَتَأْتِي مَعَنَا؟", "tr": "Hal sa-taʾtī maʿanā?", "id": "Apakah kamu akan ikut bersama kami?", "t": 7, "em": ""}, {"n": "944", "ar": "لَنْ أَتَأَخَّرَ مَرَّةً أُخْرَى.", "tr": "Lan ataʾakhkhara marratan ukhrā.", "id": "Saya tidak akan terlambat lagi.", "t": 7, "em": "⏰"}, {"n": "945", "ar": "أُرِيدُ أَنْ أَنَامَ مُبَكِّرًا الْيَوْمَ.", "tr": "Urīdu an anāma mubakkiran al-yawma.", "id": "Hari ini saya ingin tidur lebih awal.", "t": 7, "em": "📅😴"}, {"n": "946", "ar": "يَجِبُ أَنْ أَذْهَبَ الْآنَ.", "tr": "Yajibu an adhhaba al-āna.", "id": "Saya harus pergi sekarang.", "t": 7, "em": ""}, {"n": "947", "ar": "يَجِبُ أَنْ نَسْتَعِدَّ لِلِامْتِحَانِ.", "tr": "Yajibu an nastaʿidda lil-imtiḥāni.", "id": "Kita harus bersiap untuk ujian.", "t": 7, "em": "📝"}, {"n": "948", "ar": "أَسْتَطِيعُ أَنْ أَسْبَحَ.", "tr": "Astaṭīʿu an asbaḥa.", "id": "Saya bisa berenang.", "t": 7, "em": "🏊"}, {"n": "949", "ar": "لَا أَسْتَطِيعُ أَنْ أَقُودَ السَّيَّارَةَ.", "tr": "Lā astaṭīʿu an aqūda as-sayyārata.", "id": "Saya tidak bisa mengemudi mobil.", "t": 7, "em": "🚗"}, {"n": "950", "ar": "هَلْ تَسْتَطِيعُ أَنْ تَأْتِيَ غَدًا؟", "tr": "Hal tastaṭīʿu an taʾtiya ghadan?", "id": "Bisakah kamu datang besok?", "t": 7, "em": "📅"}, {"n": "951", "ar": "مِنَ الْمُمْكِنِ أَنْ أَتَأَخَّرَ قَلِيلًا.", "tr": "Mina al-mumkini an ataʾakhkhara qalīlan.", "id": "Mungkin saya akan terlambat sedikit.", "t": 7, "em": "⏰"}, {"n": "952", "ar": "فِي الْأُسْبُوعِ الْقَادِمِ لَدَيَّ عُطْلَةٌ.", "tr": "Fī al-usbūʿi al-qādimi ladayya ʿuṭlatun.", "id": "Minggu depan saya libur.", "t": 7, "em": "📅"}, {"n": "953", "ar": "أُخَطِّطُ لِلسَّفَرِ إِلَى تُرْكِيَا.", "tr": "Ukhaṭṭiṭu lil-safari ilā Turkiyā.", "id": "Saya merencanakan bepergian ke Turki.", "t": 7, "em": ""}, {"n": "954", "ar": "سَأَبْدَأُ دَوْرَةً جَدِيدَةً الشَّهْرَ الْقَادِمَ.", "tr": "Sa-abdaʾu dawratan jadīdatan ash-shahra al-qādima.", "id": "Bulan depan saya akan memulai kursus baru.", "t": 7, "em": ""}, {"n": "955", "ar": "أَتَمَنَّى أَنْ أَتَكَلَّمَ الْعَرَبِيَّةَ بِطَلَاقَةٍ.", "tr": "Atamannā an atakallama al-ʿarabiyyata bi-ṭalāqatin.", "id": "Saya berharap bisa berbicara bahasa Arab dengan lancar.", "t": 7, "em": "🗣️"}, {"n": "956", "ar": "فِي الْمُسْتَقْبَلِ أُرِيدُ أَنْ أَعْمَلَ فِي الْخَارِجِ.", "tr": "Fī al-mustaqbali urīdu an aʿmala fī al-khāriji.", "id": "Di masa depan saya ingin bekerja di luar negeri.", "t": 7, "em": ""}, {"n": "957", "ar": "سَأَشْتَرِي بَيْتًا صَغِيرًا يَوْمًا مَا.", "tr": "Sa-ashtarī baytan ṣaghīran yawman mā.", "id": "Suatu hari saya akan membeli rumah kecil.", "t": 7, "em": "🛍️🏠"}, {"n": "958", "ar": "غَدًا سَأَسْتَيْقِظُ مُبَكِّرًا لِأَذْهَبَ إِلَى السُّوقِ.", "tr": "Ghadan sa-astayqiẓu mubakkiran li-adhhaba ilā as-sūqi.", "id": "Besok saya akan bangun pagi untuk pergi ke pasar.", "t": 7, "em": "📅🌅"}, {"n": "959", "ar": "مَتَى سَتَنْتَهِي مِنَ الْعَمَلِ؟", "tr": "Matā sa-tantahī mina al-ʿamali?", "id": "Kapan kamu selesai kerja?", "t": 7, "em": ""}, {"n": "960", "ar": "سَنَلْتَقِي أَمَامَ الْمَسْجِدِ بَعْدَ الصَّلَاةِ.", "tr": "Sa-naltaqī amāma al-masjidi baʿda aṣ-ṣalāti.", "id": "Kita akan bertemu di depan masjid setelah salat.", "t": 7, "em": ""}, {"n": "961", "ar": "إِذَا نَجَحْتُ فِي الِامْتِحَانِ سَأُقِيمُ حَفْلَةً.", "tr": "Idhā najaḥtu fī al-imtiḥāni sa-uqīmu ḥaflatan.", "id": "Jika saya lulus ujian, saya akan mengadakan pesta.", "t": 7, "em": "📝🎉"}, {"n": "962", "ar": "إِذَا أَمْطَرَتْ غَدًا سَنَبْقَى فِي الْبَيْتِ.", "tr": "Idhā amṭarat ghadan sa-nabqā fī al-bayti.", "id": "Jika besok hujan, kita akan tinggal di rumah.", "t": 7, "em": "📅🌧️"}, {"n": "963", "ar": "لَنْ أَنْسَى مَوْعِدَنَا.", "tr": "Lan ansā mawʿidanā.", "id": "Saya tidak akan lupa janji kita.", "t": 7, "em": ""}, {"n": "964", "ar": "هَلْ لَدَيْكَ خُطَّةٌ لِلْعُطْلَةِ؟", "tr": "Hal ladayka khuṭṭatun lil-ʿuṭlati?", "id": "Apakah kamu punya rencana untuk liburan?", "t": 7, "em": "🏖️"}, {"n": "965", "ar": "أُرِيدُ أَنْ أَتَعَلَّمَ الْقِيَادَةَ هَذَا الْعَامَ.", "tr": "Urīdu an ataʿallama al-qiyādata hādhā al-ʿāma.", "id": "Tahun ini saya ingin belajar mengemudi.", "t": 7, "em": "📚"}, {"n": "966", "ar": "سَأَدَّخِرُ مَالًا لِلْحَجِّ.", "tr": "Sa-addakhiru mālan lil-ḥajji.", "id": "Saya akan menabung untuk haji.", "t": 7, "em": "🐷"}, {"n": "967", "ar": "سَيَبْدَأُ الْفِيلْمُ بَعْدَ نِصْفِ سَاعَةٍ.", "tr": "Sa-yabdaʾu al-fīlmu baʿda niṣfi sāʿatin.", "id": "Filmnya akan mulai setengah jam lagi.", "t": 7, "em": "🎬⏰"}, {"n": "968", "ar": "رُبَّمَا أَزُورُكَ الْأُسْبُوعَ الْقَادِمَ.", "tr": "Rubbamā azūruka al-usbūʿa al-qādima.", "id": "Mungkin saya akan mengunjungimu minggu depan.", "t": 7, "em": "📅"}, {"n": "969", "ar": "لَا أَعْرِفُ مَاذَا سَأَفْعَلُ بَعْدَ التَّخَرُّجِ.", "tr": "Lā aʿrifu mādhā sa-afʿalu baʿda at-takharruji.", "id": "Saya belum tahu apa yang akan saya lakukan setelah lulus.", "t": 7, "em": ""}, {"n": "970", "ar": "سَأُخْبِرُكَ بِالنَّتِيجَةِ غَدًا.", "tr": "Sa-ukhbiruka bi-n-natījati ghadan.", "id": "Besok saya beri tahu hasilnya.", "t": 7, "em": "📅"}, {"n": "971", "ar": "هَلْ نَسْتَطِيعُ أَنْ نَلْتَقِيَ غَدًا؟", "tr": "Hal nastaṭīʿu an nalqiya ghadan?", "id": "Bisakah kita bertemu besok?", "t": 7, "em": "📅"}, {"n": "972", "ar": "فِي أَيِّ سَاعَةٍ تُنَاسِبُكَ؟", "tr": "Fī ayyi sāʿatin tunāsibuka?", "id": "Jam berapa yang cocok untukmu?", "t": 7, "em": "⏰"}, {"n": "973", "ar": "الثَّالِثَةُ تُنَاسِبُنِي.", "tr": "Ath-thālithatu tunāsibunī.", "id": "Jam tiga cocok bagi saya.", "t": 7, "em": "⏰"}, {"n": "974", "ar": "هَلْ يُمْكِنُ تَأْجِيلُ الْمَوْعِدِ؟", "tr": "Hal yumkinu taʾjīlu al-mawʿidi?", "id": "Bisakah janjinya ditunda?", "t": 7, "em": ""}, {"n": "975", "ar": "أَرْجُو أَنْ تُغَيِّرَ الْمَوْعِدَ إِلَى الْأُسْبُوعِ الْقَادِمِ.", "tr": "Arjū an tughayyira al-mawʿida ilā al-usbūʿi al-qādimi.", "id": "Tolong ubah janjinya ke minggu depan.", "t": 7, "em": "📅"}, {"n": "976", "ar": "أَلْغَيْتُ حَجْزِي.", "tr": "Alghaytu ḥajzī.", "id": "Saya membatalkan pesanan saya.", "t": 7, "em": ""}, {"n": "977", "ar": "هَلْ أَنْتَ مُتَفَرِّغٌ مَسَاءَ الْخَمِيسِ؟", "tr": "Hal anta mutafarrighun masāʾa al-khamīsi?", "id": "Apakah kamu luang Kamis malam?", "t": 7, "em": "🌙"}, {"n": "978", "ar": "لَدَيَّ اجْتِمَاعٌ حَتَّى الرَّابِعَةِ.", "tr": "Ladayya ijtimāʿun ḥattā ar-rābiʿati.", "id": "Saya ada rapat sampai jam empat.", "t": 7, "em": "👥⏰"}, {"n": "979", "ar": "يُمْكِنُنَا أَنْ نَلْتَقِيَ بَعْدَ ذَلِكَ.", "tr": "Yumkinunā an nalqiya baʿda dhālika.", "id": "Kita bisa bertemu setelah itu.", "t": 7, "em": ""}, {"n": "980", "ar": "أَيْنَ نَلْتَقِي؟", "tr": "Ayna naltaqī?", "id": "Di mana kita bertemu?", "t": 7, "em": ""}, {"n": "981", "ar": "سَأَكُونُ هُنَاكَ فِي الْوَقْتِ الْمُحَدَّدِ.", "tr": "Sa-akūnu hunāka fī al-waqti al-muḥaddadi.", "id": "Saya akan ada di sana tepat waktu.", "t": 7, "em": ""}, {"n": "982", "ar": "إِذَا تَأَخَّرْتُ سَأُخْبِرُكَ.", "tr": "Idhā taʾakhkhartu sa-ukhbiruka.", "id": "Jika saya terlambat, saya akan memberitahumu.", "t": 7, "em": "⏰"}, {"n": "983", "ar": "اتَّفَقْنَا عَلَى الْمَوْعِدِ.", "tr": "Ittafaqnā ʿalā al-mawʿidi.", "id": "Kita sudah sepakat soal waktunya.", "t": 7, "em": ""}, {"n": "984", "ar": "أُذَكِّرُكَ بِمَوْعِدِنَا غَدًا.", "tr": "Udhakkiruka bi-mawʿidinā ghadan.", "id": "Saya mengingatkanmu soal janji kita besok.", "t": 7, "em": "📅"}, {"n": "985", "ar": "هَلْ تُرِيدُ أَنْ نَجْعَلَهُ فِي الصَّبَاحِ؟", "tr": "Hal turīdu an najʿalahu fī aṣ-ṣabāḥi?", "id": "Maukah kita menjadwalkannya pagi hari?", "t": 7, "em": "🌅"}, {"n": "986", "ar": "لَا مُشْكِلَةَ فِي ذَلِكَ.", "tr": "Lā mushkilata fī dhālika.", "id": "Tidak ada masalah soal itu.", "t": 7, "em": ""}, {"n": "987", "ar": "سَأُرْسِلُ لَكَ التَّفَاصِيلَ مَسَاءً.", "tr": "Sa-ursilu laka at-tafāṣīla masāʾan.", "id": "Saya akan mengirimkan rinciannya nanti malam.", "t": 7, "em": "🌙"}, {"n": "988", "ar": "أَضَفْتُ الْمَوْعِدَ إِلَى تَقْوِيمِي.", "tr": "Aḍaftu al-mawʿida ilā taqwīmī.", "id": "Saya menambahkan janji itu ke kalender saya.", "t": 7, "em": ""}, {"n": "989", "ar": "تَعَلَّمْتُ كَلِمَاتٍ جَدِيدَةً الْيَوْمَ.", "tr": "Taʿallamtu kalimātin jadīdatan al-yawma.", "id": "Hari ini saya belajar kata-kata baru.", "t": 8, "em": "📅📚"}, {"n": "990", "ar": "أَحْفَظُ كَلِمَتَيْنِ كُلَّ يَوْمٍ.", "tr": "Aḥfaẓu kalimatayni kulla yawmin.", "id": "Saya menghafal dua kata setiap hari.", "t": 8, "em": ""}, {"n": "991", "ar": "أُرَاجِعُ الدَّرْسَ كُلَّ مَسَاءٍ.", "tr": "Urājiʿu ad-darsa kulla masāʾin.", "id": "Saya mengulang pelajaran setiap sore.", "t": 8, "em": "📘"}, {"n": "992", "ar": "أَتَعَلَّمُ الْعَرَبِيَّةَ لِأَنَّهَا مُهِمَّةٌ لِي.", "tr": "Ataʿallamu al-ʿarabiyyata li-annahā muhimmatun lī.", "id": "Saya belajar bahasa Arab karena itu penting bagi saya.", "t": 8, "em": "📚🗣️"}, {"n": "993", "ar": "أَتَكَلَّمُ الْعَرَبِيَّةَ أَفْضَلَ مِنْ قَبْلُ.", "tr": "Atakallamu al-ʿarabiyyata afḍala min qablu.", "id": "Bahasa Arab saya lebih baik daripada sebelumnya.", "t": 8, "em": "🗣️"}, {"n": "994", "ar": "أُحَاوِلُ أَنْ أَتَكَلَّمَ كُلَّ يَوْمٍ.", "tr": "Uḥāwilu an atakallama kulla yawmin.", "id": "Saya berusaha berbicara setiap hari.", "t": 8, "em": ""}, {"n": "995", "ar": "لَا تَخَفْ مِنَ الْأَخْطَاءِ.", "tr": "Lā takhaf mina al-akhṭāʾi.", "id": "Jangan takut salah.", "t": 8, "em": "😨"}, {"n": "996", "ar": "كُلُّ شَخْصٍ يُخْطِئُ أَحْيَانًا.", "tr": "Kullu shakhṣin yukhṭiʾu aḥyānan.", "id": "Setiap orang kadang berbuat salah.", "t": 8, "em": ""}, {"n": "997", "ar": "مِنَ الْجَيِّدِ أَنْ تَسْأَلَ.", "tr": "Mina al-jayyidi an tasʾala.", "id": "Bagus kalau kamu bertanya.", "t": 8, "em": ""}, {"n": "998", "ar": "هَذَا سُؤَالٌ جَيِّدٌ.", "tr": "Hādhā suʾālun jayyidun.", "id": "Itu pertanyaan yang bagus.", "t": 8, "em": ""}, {"n": "999", "ar": "دَرَسْتُ الْعَرَبِيَّةَ لِمُدَّةِ سَنَةٍ.", "tr": "Darastu al-ʿarabiyyata li-muddati sanatin.", "id": "Saya belajar bahasa Arab selama setahun.", "t": 8, "em": "📚🗣️"}, {"n": "1000", "ar": "أَدْرُسُ فِي مَعْهَدٍ لِتَعْلِيمِ اللُّغَاتِ.", "tr":  "t": 11, "em": ""}, {"n": "1142", "ar": "أُسَخِّنُ الزَّيْتَ ثُمَّ أُضِيفُ الْبَصَلَ.", "tr": "Usakhkhinu az-zayta thumma uḍīfu al-baṣala.", "id": "Saya memanaskan minyak lalu menambahkan bawang.", "t": 11, "em": ""}, {"n": "1143", "ar": "أَقْلِي الْبَيْضَ فِي الصَّبَاحِ.", "tr": "Aqlī al-bayḍa fī aṣ-ṣabāḥi.", "id": "Saya menggoreng telur di pagi hari.", "t": 11, "em": "🥚🌅"}, {"n": "1144", "ar": "الْخُبْزُ يَخْرُجُ مِنَ الْفُرْنِ سَاخِنًا.", "tr": "Al-khubzu yakhruju mina al-furni sākhinan.", "id": "Roti keluar dari oven masih panas.", "t": 11, "em": "🍞☀️"}, {"n": "1145", "ar": "الْوَجْبَةُ تَكْفِي لِشَخْصَيْنِ.", "tr": "Al-wajbatu takfī li-shakhṣayni.", "id": "Porsinya cukup untuk dua orang.", "t": 11, "em": ""}, {"n": "1146", "ar": "لَا أَشْرَبُ الْمَشْرُوبَاتِ الْغَازِيَّةَ.", "tr": "Lā ashrabu al-mashrūbāti al-ghāziyyata.", "id": "Saya tidak minum minuman bersoda.", "t": 11, "em": "🥤"}, {"n": "1147", "ar": "أَشْرَبُ ثَمَانِيَةَ أَكْوَابٍ مِنَ الْمَاءِ يَوْمِيًّا.", "tr": "Ashrabu thamāniyata akwābin mina al-māʾi yawmiyyan.", "id": "Saya minum delapan gelas air setiap hari.", "t": 11, "em": "🥤💧"}, {"n": "1148", "ar": "تَنَاوَلْنَا الْغَدَاءَ فِي مَطْعَمٍ جَدِيدٍ.", "tr": "Tanāwalnā al-ghadāʾa fī maṭʿamin jadīdin.", "id": "Kami makan siang di restoran baru.", "t": 11, "em": "🍱🍽️"}, {"n": "1149", "ar": "كَانَ الْمَكَانُ هَادِئًا وَنَظِيفًا.", "tr": "Kāna al-makānu hādiʾan wa-naẓīfan.", "id": "Tempatnya tenang dan bersih.", "t": 11, "em": "😌"}, {"n": "1150", "ar": "أُرِيدُ أَنْ أَحْجِزَ طَاوِلَةً لِلْعَشَاءِ غَدًا.", "tr": "Urīdu an aḥjiza ṭāwilatan lil-ʿashāʾi ghadan.", "id": "Saya mau memesan meja untuk makan malam besok.", "t": 11, "em": "🪑🍲"}, {"n": "1151", "ar": "أُرِيدُ أَنْ أَتَعَلَّمَ وَصْفَةً جَدِيدَةً.", "tr": "Urīdu an ataʿallama waṣfatan jadīdatan.", "id": "Saya ingin belajar resep baru.", "t": 12, "em": "📚📝"}, {"n": "1152", "ar": "نَحْتَاجُ إِلَى كُوبَيْنِ مِنَ الدَّقِيقِ.", "tr": "Naḥtāju ilā kūbayni mina ad-daqīqi.", "id": "Kita butuh dua gelas tepung.", "t": 12, "em": ""}, {"n": "1153", "ar": "اخْلِطِ الْبَيْضَ مَعَ السُّكَّرِ.", "tr": "Ikhliṭi al-bayḍa maʿa as-sukkari.", "id": "Campurkan telur dengan gula.", "t": 12, "em": "🥚🍬"}, {"n": "1154", "ar": "أَضِفِ الْحَلِيبَ تَدْرِيجِيًّا.", "tr": "Aḍifi al-ḥalība tadrījiyyan.", "id": "Tambahkan susu sedikit demi sedikit.", "t": 12, "em": "🥛"}, {"n": "1155", "ar": "اتْرُكِ الْعَجِينَ نِصْفَ سَاعَةٍ.", "tr": "Utruki al-ʿajīna niṣfa sāʿatin.", "id": "Diamkan adonan setengah jam.", "t": 12, "em": "⏰"}, {"n": "1156", "ar": "سَخِّنِ الْفُرْنَ إِلَى مِائَةٍ وَثَمَانِينَ دَرَجَةً.", "tr": "Sakhkhini al-furna ilā miʾatin wa-thamānīna darajatan.", "id": "Panaskan oven sampai 180 derajat.", "t": 12, "em": ""}, {"n": "1157", "ar": "اخْبِزْهُ لِمُدَّةِ عِشْرِينَ دَقِيقَةً.", "tr": "Ikhbizhu li-muddati ʿishrīna daqīqatan.", "id": "Panggang selama dua puluh menit.", "t": 12, "em": ""}, {"n": "1158", "ar": "قَلِّبِ الْحَسَاءَ كُلَّ قَلِيلٍ.", "tr": "Qallibi al-ḥasāʾa kulla qalīlin.", "id": "Aduk sup sesekali.", "t": 12, "em": "🍲"}, {"n": "1159", "ar": "قَطِّعِ الْبَصَلَ إِلَى شَرَائِحَ.", "tr": "Qaṭṭiʿi al-baṣala ilā sharāʾiḥa.", "id": "Iris bawangnya.", "t": 12, "em": ""}, {"n": "1160", "ar": "أَضِفِ الْبَهَارَاتِ حَسَبَ الذَّوْقِ.", "tr": "Aḍifi al-bahārāti ḥasaba adh-dhawqi.", "id": "Tambahkan rempah sesuai selera.", "t": 12, "em": ""}, {"n": "1161", "ar": "الطَّعَامُ يَحْتَاجُ إِلَى مَزِيدٍ مِنَ الْمِلْحِ.", "tr": "Aṭ-ṭaʿāmu yaḥtāju ilā mazīdin mina al-milḥi.", "id": "Masakannya perlu garam lebih banyak.", "t": 12, "em": "🧂"}, {"n": "1162", "ar": "احْتَرَقَ الْخُبْزُ لِأَنِّي نَسِيتُهُ.", "tr": "Iḥtaraqa al-khubzu li-annī nasītuhu.", "id": "Rotinya gosong karena saya lupa.", "t": 12, "em": "🍞"}, {"n": "1163", "ar": "هَلْ جَرَّبْتَ هَذِهِ الْوَصْفَةَ مِنْ قَبْلُ؟", "tr": "Hal jarrabta hādhihi al-waṣfata min qablu?", "id": "Apakah kamu pernah mencoba resep ini?", "t": 12, "em": "📝"}, {"n": "1164", "ar": "الْمَطْبَخُ مَلِيءٌ بِالرَّائِحَةِ الطَّيِّبَةِ.", "tr": "Al-maṭbakhu malīʾ eter.", "t": 17, "em": ""}, {"n": "1328", "ar": "أَشْعُرُ بِالنَّشَاطِ بَعْدَ التَّمْرِينِ.", "tr": "Ashʿuru bi-n-nashāṭi baʿda at-tamrīni.", "id": "Saya merasa segar setelah olahraga.", "t": 17, "em": "🏃"}, {"n": "1329", "ar": "أُمَارِسُ التَّمَارِينَ مَرَّتَيْنِ فِي الْأُسْبُوعِ.", "tr": "Umārisu at-tamārīna marratayni fī al-usbūʿi.", "id": "Saya berolahraga dua kali seminggu.", "t": 17, "em": ""}, {"n": "1330", "ar": "لَعِبْنَا كُرَةَ السَّلَّةِ أَمْسِ.", "tr": "Laʿibnā kurata as-sallati amsi.", "id": "Kemarin kami main bola basket.", "t": 17, "em": "📅⚽"}, {"n": "1331", "ar": "هَلْ تُشَجِّعُ فَرِيقًا مُعَيَّنًا؟", "tr": "Hal tushajjiʿu farīqan muʿayyanan?", "id": "Apakah kamu mendukung tim tertentu?", "t": 17, "em": "👥"}, {"n": "1332", "ar": "الْمُدَرِّبُ يُدَرِّبُنَا ثَلَاثَةَ أَيَّامٍ فِي الْأُسْبُوعِ.", "tr": "Al-mudarribu yudarribunā thalātha ayyāmin fī al-usbūʿi.", "id": "Pelatih melatih kami tiga hari seminggu.", "t": 17, "em": ""}, {"n": "1333", "ar": "تَوَقَّفْتُ عَنِ التَّدْخِينِ.", "tr": "Tawaqqaftu ʿani at-tadkhīni.", "id": "Saya berhenti merokok.", "t": 17, "em": ""}, {"n": "1334", "ar": "أُحَاوِلُ أَنْ آكُلَ طَعَامًا صِحِّيًّا.", "tr": "Uḥāwilu an ākula ṭaʿāman ṣiḥḥiyyan.", "id": "Saya berusaha makan makanan sehat.", "t": 17, "em": "🍽️💪"}, {"n": "1335", "ar": "يَجِبُ أَنْ نَشْرَبَ مَاءً بَعْدَ الرِّيَاضَةِ.", "tr": "Yajibu an nashraba māʾan baʿda ar-riyāḍati.", "id": "Kita harus minum air setelah olahraga.", "t": 17, "em": "🥤💧"}, {"n": "1336", "ar": "السِّبَاحَةُ مُفِيدَةٌ لِلظَّهْرِ.", "tr": "As-sibāḥatu mufīdatun lil-ẓahri.", "id": "Berenang bagus untuk punggung.", "t": 17, "em": "🏊🧍"}, {"n": "1337", "ar": "أَشْتَرِكُ فِي نَادٍ رِيَاضِيٍّ.", "tr": "Ashtariku fī nādin riyāḍiyyin.", "id": "Saya mendaftar di klub olahraga.", "t": 17, "em": "🏃"}, {"n": "1338", "ar": "سَتُمْطِرُ غَدًا.", "tr": "Sa-tumṭiru ghadan.", "id": "Besok akan hujan.", "t": 18, "em": "📅🌧️"}, {"n": "1339", "ar": "خُذْ مِظَلَّةً مَعَكَ.", "tr": "Khudh miẓallatan maʿaka.", "id": "Bawalah payung bersamamu.", "t": 18, "em": ""}, {"n": "1340", "ar": "كَانَ الْجَوُّ بَارِدًا أَمْسِ.", "tr": "Kāna al-jawwu bāridan amsi.", "id": "Kemarin cuacanya dingin.", "t": 18, "em": "📅🥶"}, {"n": "1341", "ar": "الطَّقْسُ فِي الصَّيْفِ حَارٌّ وَرَطْبٌ.", "tr": "Aṭ-ṭaqsu fī aṣ-ṣayfi ḥārrun wa-raṭbun.", "id": "Cuaca di musim panas panas dan lembap.", "t": 18, "em": "☀️"}, {"n": "1342", "ar": "أُفَضِّلُ الرَّبِيعَ لِأَنَّ الْجَوَّ مُعْتَدِلٌ.", "tr": "Ufaḍḍilu ar-rabīʿa li-anna al-jawwa muʿtadilun.", "id": "Saya lebih suka musim semi karena cuacanya sejuk.", "t": 18, "em": "🌸"}, {"n": "1343", "ar": "مَاذَا تَقُولُ نَشْرَةُ الطَّقْسِ؟", "tr": "Mādhā taqūlu nashratu aṭ-ṭaqsi?", "id": "Apa kata prakiraan cuaca?", "t": 18, "em": ""}, {"n": "1344", "ar": "سَتَكُونُ دَرَجَةُ الْحَرَارَةِ ثَلَاثِينَ.", "tr": "Sa-takūnu darajatu al-ḥarārati thalāthīna.", "id": "Suhunya akan tiga puluh derajat.", "t": 18, "em": ""}, {"n": "1345", "ar": "الْجَوُّ غَائِمٌ وَالرِّيَاحُ قَوِيَّةٌ.", "tr": "Al-jawwu ghāʾimun wa-r-riyāḥu qawiyyatun.", "id": "Cuaca mendung dan angin kencang.", "t": 18, "em": "☁️💨"}, {"n": "1346", "ar": "هَلْ تَتَوَقَّعُ أَنْ تُمْطِرَ؟", "tr": "Hal tatawaqqaʿu an tumṭira?", "id": "Apakah kamu kira akan hujan?", "t": 18, "em": "🌧️"}, {"n": "1347", "ar": "فِي الْخَرِيفِ تَتَسَاقَطُ الْأَوْرَاقُ.", "tr": "Fī al-kharīfi tatasāqaṭu al-awrāqu.", "id": "Di musim gugur daun-daun berguguran.", "t": 18, "em": "🍂"}, {"n": "1348", "ar": "الْجَوُّ مُشْمِسٌ وَجَمِيلٌ الْيَوْمَ.", "tr": "Al-jawwu mushmisun wa-jamīlun al-yawma.", "id": "Cuaca cerah dan indah hari ini.", "t": 18, "em": "☀️📅"}, {"n": "1349", "ar": "هَبَّتْ عَاصِفَةٌ قَوِيَّةٌ أَمْسِ.", "tr": "Habbat ʿāṣifatun qawiyyatun amsi.", "id": "Kemarin ada badai kencang.", "t": 18, "em": "📅"}, {"n": "1350", "ar": "الرُّطُوبَةُ عَالِيَةٌ فِي هَذَا الْوَقْتِ.", "tr": "Ar-ruṭūbatu ʿāliyatun fī hādhā al-waqti.", "id": "Kelembapan tinggi pada waktu ini.", "t": 18, "em": ""}, {"n": "1351", "ar": "تَنْخَفِضُ دَرَجَةُ الْحَرَارَةِ لَيْلًا.", "tr": "Tankhafiḍu darajatu al-ḥarārati laylan.", "id": "Suhu turun di malam hari.", "t": 18, "em": "🌙"}, {"n": "1352", "ar": "أَلْبَسُ مَلَابِسَ ثَقِيلَةً فِي الشِّتَاءِ.", "tr": "Albasu malābisa thaqīlatan fī ash-shitāʾi.", "id": "Saya memakai pakaian tebal di musim dingin.", "t": 18, "em": "👕❄️"}, {"n": "1353", "ar": "أَحْيَانًا يَنْزِلُ الثَّلْجُ فِي الْجِبَالِ.", "tr": "Aḥyānan yanzilu ath-thaljū fī al-jibāli.", "id": "Kadang salju turun di pegunungan.", "t": 18, "em": "❄️"}, {"n": "1354", "ar": "لَا أُحِبُّ الْحَرَّ الشَّدِيدَ.", "tr": "Lā uḥibbu al-ḥarra ash-shadīda.", "id": "Saya tidak suka panas terik.", "t": 18, "em": "☀️"}, {"n": "1355", "ar": "هَلْ سَيَكُونُ الْجَوُّ جَمِيلًا غَدًا؟", "tr": "Hal sa-yakūnu al-jawwu jamīlan ghadan?", "id": "Apakah cuaca besok akan bagus?", "t": 18, "em": "📅"}, {"n": "1356", "ar": "يَقُولُونَ إِنَّ الْمَطَرَ سَيَسْتَمِرُّ.", "tr": "Yaqūlūna inna al-maṭara sa-yastamirru.", "id": "Katanya hujan akan terus berlanjut.", "t": 18, "em": "🌧️"}, {"n": "1357", "ar": "نَذْهَبُ إِلَى الْغَابَةِ فِي الرَّبِيعِ.", "tr": "Nadhhabu ilā al-ghābati fī ar-rabīʿi.", "id": "Kami pergi ke hutan di musim semi.", "t": 18, "em": "🌲🌸"}, {"n": "1358", "ar": "النَّهْرُ قَرِيبٌ مِنْ قَرْيَتِنَا.", "tr": "An-nahru qarībun min qaryatinā.", "id": "Sungai dekat dengan desa kami.", "t": 18, "em": "🏞️🏡"}, {"n": "1359", "ar": "الْجِبَالُ عَالِيَةٌ وَجَمِيلَةٌ.", "tr": "Al-jibālu ʿāliyatun wa-jamīlatun.", "id": "Gunung-gunungnya tinggi dan indah.", "t": 18, "em": "⛰️"}, {"n": "1360", "ar": "رَأَيْنَا طُيُورًا مُلَوَّنَةً.", "tr": "Raʾaynā ṭuyūran mulawwanatan.", "id": "Kami melihat burung-burung berwarna-warni.", "t": 18, "em": "🐦"}, {"n": "1361", "ar": "الْحَدِيقَةُ مَلِيئَةٌ بِالْأَزْهَارِ.", "tr": "Al-ḥadīqatu malīʾatun bi-l-azhāri.", "id": "Taman penuh dengan bunga.", "t": 18, "em": "🌳🌸"}, {"n": "1362", "ar": "يَجِبُ أَنْ نُحَافِظَ عَلَى نَظَافَةِ الْبِيئَةِ.", "tr": "Yajibu an nuḥāfiẓa ʿalā naẓāfati al-bīʾati.", "id": "Kita harus menjaga kebersihan lingkungan.", "t": 18, "em": ""}, {"n": "1363", "ar": "لَا تَرْمِ الْقُمَامَةَ فِي الشَّارِعِ.", "tr": "Lā tarmi al-qumāmata fī ash-shāriʿi.", "id": "Jangan buang sampah di jalan.", "t": 18, "em": "🛣️"}, {"n": "1364", "ar": "أَسْتَخْدِمُ كِيسًا قَابِلًا لِإِعَادَةِ الِاسْتِخْدَامِ.", "tr": "Astakhdimu kīsan qābilan li-iʿādati al-istikhdāmi.", "id": "Saya memakai kantong yang bisa dipakai ulang.", "t": 18, "em": ""}, {"n": "1365", "ar": "الْجَمَلُ يَعِيشُ فِي الصَّحْرَاءِ.", "tr": "Al-jamalu yaʿīshu fī aṣ-ṣaḥrāʾi.", "id": "Unta hidup di padang pasir.", "t": 18, "em": "🐪"}, {"n": "1366", "ar": "السَّمَكُ يَسْبَحُ فِي الْبَحْرِ.", "tr": "As-samaku yasbaḥu fī al-baḥri.", "id": "Ikan berenang di laut.", "t": 18, "em": "🐟🏊"}, {"n": "1367", "ar": "الشَّمْسُ تَغْرُبُ خَلْفَ الْجَبَلِ.", "tr": "Ash-shamsu taghrubu khalfa al-jabali.", "id": "Matahari terbenam di balik gunung.", "t": 18, "em": "☀️⛰️"}, {"n": "1368", "ar": "مَا أَجْمَلَ الْغُرُوبَ هُنَا!", "tr": "Mā ajmala al-ghurūba hunā!", "id": "Alangkah indahnya senja di sini!", "t": 18, "em": ""}, {"n": "1369", "ar": "أُحِبُّ أَنْ أَقْرَأَ الرِّوَايَاتِ.", "tr": "Uḥibbu an aqraʾa ar-riwāyāti.", "id": "Saya suka membaca novel.", "t": 19, "em": "📖"}, {"n": "1370", "ar": "كُنْتُ أَلْعَبُ كُرَةَ الْقَدَمِ وَأَنَا صَغِيرٌ.", "tr": "Kuntu alʿabu kurata al-qadami wa-anā ṣaghīrun.", "id": "Dulu waktu kecil saya bermain sepak bola.", "t": 19, "em": "⚽"}, {"n": "1371", "ar": "هَلْ تُمَارِسُ الرِّيَاضَةَ؟", "tr": "Hal tumārisu ar-riyāḍata?", "id": "Apakah kamu berolahraga?", "t": 19, "em": ""}, {"n": "1372", "ar": "أَذْهَبُ إِلَى النَّادِي مَرَّتَيْنِ فِي الْأُسْبُوعِ.", "tr": "Adhhabu ilā an-nādī marratayni fī al-usbūʿi.", "id": "Saya pergi ke pusat kebugaran dua kali seminggu.", "t": 19, "em": ""}, {"n": "1373", "ar": "أُحِبُّ التَّصْوِيرَ وَالسَّفَرَ.", "tr": "Uḥibbu at-taṣwīra wa-s-safara.", "id": "Saya suka fotografi dan bepergian.", "t": 19, "em": ""}, {"n": "1374", "ar": "أَسْمَعُ الْمُوسِيقَى عِنْدَمَا أَدْرُسُ.", "tr": "Asmaʿu al-mūsīqā ʿindamā adrusu.", "id": "Saya mendengarkan musik ketika belajar.", "t": 19, "em": "🎵📚"}, {"n": "1375", "ar": "مَا نَوْعُ الْأَفْلَامِ الَّتِي تُحِبُّهَا؟", "tr": "Mā nawʿu al-aflāmi allatī tuḥibbuhā?", "id": "Film jenis apa yang kamu suka?", "t": 19, "em": "🎬"}, {"n": "1376", "ar": "دَعْنَا نَذْهَبْ إِلَى السِّينَمَا.", "tr": "Daʿnā nadhhab ilā as-sīnamā.", "id": "Mari kita pergi ke bioskop.", "t": 19, "em": "🎬"}, {"n": "1377", "ar": "هَلْ أَنْتَ مُتَفَرِّغٌ يَوْمَ السَّبْتِ؟", "tr": "Hal anta mutafarrighun yawma as-sabti?", "id": "Apakah kamu luang hari Sabtu?", "t": 19, "em": ""}, {"n": "1378", "ar": "أُرِيدُ أَنْ أَدْعُوَكَ إِلَى الْعَشَاءِ.", "tr": "Urīdu an adʿuwaka ilā al-ʿashāʾi.", "id": "Saya ingin mengundangmu makan malam.", "t": 19, "em": "🍲"}, {"n": "1379", "ar": "شُكْرًا عَلَى الدَّعْوَةِ.", "tr": "Shukran ʿalā ad-daʿwati.", "id": "Terima kasih atas undangannya.", "t": 19, "em": "💌"}, {"n": "1380", "ar": "آسِفٌ، لَدَيَّ مَوْعِدٌ آخَرُ.", "tr": "Āsifun, ladayya mawʿidun ākharu.", "id": "Maaf, saya ada janji lain.", "t": 19, "em": ""}, {"n": "1381", "ar": "هَلْ شَاهَدْتَ هَذَا الْفِيلْمَ مِنْ قَبْلُ؟", "tr": "Hal shāhadta hādhā al-fīlma min qablu?", "id": "Apakah kamu pernah menonton film ini sebelumnya?", "t": 19, "em": "🎬"}, {"n": "1382", "ar": "أَقْضِي وَقْتِي فِي الْقِرَاءَةِ وَالرَّسْمِ.", "tr": "Aqḍī waqtī fī al-qirāʾati wa-r-rasmi.", "id": "Saya mengisi waktu dengan membaca dan menggambar.", "t": 19, "em": "📖"}, {"n": "1383", "ar": "بَدَأْتُ أَتَعَلَّمُ الْعَزْفَ عَلَى الْعُودِ.", "tr": "Badaʾtu ataʿallamu al-ʿazfa ʿalā al-ʿūdi.", "id": "Saya mulai belajar bermain oud.", "t": 19, "em": "📚"}, {"n": "1384", "ar": "شَاهَدْنَا مُبَارَاةً رَائِعَةً أَمْسِ.", "tr": "Shāhadnā mubārātan rāʾiʿatan amsi.", "id": "Kemarin kami menonton pertandingan yang seru.", "t": 19, "em": "📅"}, {"n": "1385", "ar": "فَازَ فَرِيقُنَا بِهَدَفَيْنِ.", "tr": "Fāza farīqunā bi-hadafayni.", "id": "Tim kami menang dua gol.", "t": 19, "em": "👥"}, {"n": "1386", "ar": "
